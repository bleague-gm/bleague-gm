<!DOCTYPE html>
<html lang="ja">

<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif}
header{background:#18263c;padding:16px;border-bottom:2px solid #e0a83c}
h1{font-size:22px;margin:0}
header p{margin:6px 0 0;color:#b8c5db;font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#111c2d;position:sticky;top:0;z-index:2}
button{border:0;border-radius:8px;padding:10px 12px;background:#30445f;color:white;font-weight:700;cursor:pointer}
button.primary{background:#d69a2d;color:#171717}
button.danger{background:#9f3947}
button:disabled{opacity:.45}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:#1a2940;border:1px solid #344761;border-radius:12px;padding:14px;margin:0 0 13px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 7px}
.muted{color:#aebdd2;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{background:#111c2d;border-radius:9px;padding:12px;font-size:12px}
.stat strong{display:block;font-size:20px;margin-top:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #344761;padding:12px 0}
.player-info{min-width:0;flex:1}
.player-info strong{display:block}
.player-info small{color:#aebdd2;display:block;margin-top:4px}
.player-actions{display:flex;gap:5px;flex-wrap:wrap}
input,select{background:#101827;color:white;border:1px solid #50627b;border-radius:7px;padding:9px;max-width:100%}
label{display:block;margin:9px 0}
label span{display:block;font-size:13px;margin-bottom:5px;color:#c5d1e2}
.notice{background:#243b51;border-radius:8px;padding:10px;font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid #344761;text-align:center;white-space:nowrap}
th{background:#111c2d}
.highlight{background:#3b3524}
.pill{display:inline-block;border-radius:20px;background:#344761;padding:3px 8px;font-size:11px}
.scoreboard{background:#252525;border-radius:14px;padding:18px;text-align:center}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:22px 0}
.team-score{font-size:42px;font-weight:900}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:500px;margin:12px auto}
.periods div{padding:8px 2px;background:#171717;border-radius:5px}
.logline{border-bottom:1px solid #344761;padding:8px 0;font-size:13px}
footer{color:#8292aa;text-align:center;padding:20px;font-size:12px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.team-score{font-size:54px}}
</style>
</head>

"茨城ロボッツ","宇都宮ブレックス","群馬クレインサンダーズ",

"サンロッカーズ渋谷","川崎ブレイブサンダース",

"滋賀レイクス","京都ハンナリーズ","大阪エヴェッサ",

"広島ドラゴンフライズ","佐賀バルーナーズ",
"長崎ヴェルカ","琉球ゴールデンキングス"
];
const TEAM_NAMES=[...EAST,...WEST];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>Math.round(n).toLocaleString("ja-JP")+"万円";
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function makePlayer(name,pos,rating,salary,years=1,type="日本人"){
return{id:uid(),name,pos,rating,salary,years,type};
}

function makeTeams(){
return TEAM_NAMES.map(name=>({
name,
division:EAST.includes(name)?"東地区":"西地区",
wins:0,losses:0,played:0,pf:0,pa:0
}));
}

function makeSchedule(){
const games=[];
for(let r=0;r<30;r++){
const rotation=TEAM_NAMES.map((_,i)=>TEAM_NAMES[(i+r)%26]);
for(let i=0;i<13;i++){
let home=rotation[i],away=rotation[25-i];
if((r+i)%2){const t=home;home=away;away=t;}
games.push({home,away,done:false,round:r+1});
}
}
const first=games.map(g=>({
home:g.away,away:g.home,done:false,round:g.round+30
}));
return [...games,...first].map((g,i)=>({...g,id:i+1}));
}

function validGame(g){
return !!g&&Array.isArray(g.roster)&&Array.isArray(g.market)&&typeof g.cash==="number";
}

function saveGame(){
try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true;}
catch(e){console.error(e);return false;}
}

function loadGame(){
try{
let raw=localStorage.getItem(SAVE_KEY);
if(!raw)return false;
let x=JSON.parse(raw);
if(!validGame(x))return false;
G=x;
return true;
}catch(e){console.error(e);return false;}
}

function log(s){
G.log.unshift(new Date().toLocaleString("ja-JP")+" "+s);
G.log=G.log.slice(0,80);
}

// B.PREMIER仕様：1.5億円超の年俸は1.5億円（15,000万円）でキャップ計上
function capCalculatedSalary(){
return G.roster.reduce((sum,p)=>{
let sal=Number(p.salary)||0;
return sum + (sal > 15000 ? 15000 : sal);
},0);
}
function rawSalaryTotal(){ return G.roster.reduce((s,p)=>s+(Number(p.salary)||0),0); }
function foreignCount(){return G.roster.filter(p=>p.type==="外国籍").length;}
function specialCount(){return G.roster.filter(p=>["アジア特別枠","帰化"].includes(p.type)).length;}
function cap(){return{salary:capCalculatedSalary(),rawSalary:rawSalaryTotal(),cap:80000,floor:50000};}

function render(){

// B.PREMIER オンザコートフリー計算ロジック
function calculateTeamPower(isMyTeam){
if(!isMyTeam) return 76 + Math.random()*4; // 敵チームは76~80前後のベース能力
// 自チーム：オンザコートフリーのため全外国籍・帰化枠の能力を加算
const sortedRoster = [...G.roster].sort((a,b)=>b.rating-a.rating);
const top5 = sortedRoster.slice(0,5);
const baseRating = top5.reduce((s,p)=>s+p.rating,0) / Math.max(1, top5.length);
const coachBonus = G.coaches.reduce((s,c)=>s+(c.rating-70)*.08, 0);
return baseRating + coachBonus;
}

function simulateGame(){
const remaining=G.schedule.filter(x=>!x.done);
if(remaining.length===0){alert("全日程が終了しています。");return;}
const currentRound=remaining[0].round;
const roundGames=G.schedule.filter(g=>g.round===currentRound);

roundGames.forEach(g=>{
let myTeamIsHome=g.home===G.club;
let myTeamIsAway=g.away===G.club;

let homePower=calculateTeamPower(myTeamIsHome);
let awayPower=calculateTeamPower(myTeamIsAway);

let hs=0,as=0,periods=[];
for(let q=0;q<4;q++){
let h=Math.max(12,Math.round(20+Math.random()*8+(homePower-75)*.25));
let a=Math.max(12,Math.round(19+Math.random()*8+(awayPower-75)*.25));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){as+=1;periods[3][1]++;}
g.done=true;g.result={hs,as};

for(const [name,score,against] of [[g.home,hs,as],[g.away,as,hs]]){
const t=G.teams.find(x=>x.name===name);
if(t){
t.played++;t.pf+=score;t.pa+=against;
if(score>against)t.wins++;else t.losses++;
}
}

if(myTeamIsHome||myTeamIsAway){
const isHome=myTeamIsHome;
const attendance=Math.round(G.attendance*(.85+Math.random()*.3));
const revenue=isHome?Math.round(attendance*G.ticket/10000):0;
const expenses=Math.round(2000+rawSalaryTotal()/60+G.coaches.reduce((s,c)=>s+c.salary,0)/100);
const profit=revenue-expenses;
G.cash+=profit;
G.lastResult={home:g.home,away:g.away,hs,as,periods,venue:isHome?"ホームアリーナ":"アウェイアリーナ",attendance};
log(`【第${currentRound}節】${g.home} ${hs}-${as} ${g.away} / 収支 ${profit>=0?"+":""}${yen(profit)}`);
}
});

saveGame();render();
}

function processNextSeason(){
if(!confirm("シーズンを終了して次のシーズンに進みますか？\n契約選手・コーチの年数が減少し、契約満了選手はFAになります。"))return;
G.roster.forEach(p=>p.years--);
const expired=G.roster.filter(p=>p.years<=0);
G.roster=G.roster.filter(p=>p.years>0);
expired.forEach(p=>{p.years=1;G.market.push(p);});

const startYear=parseInt(G.seasonStart)+1;
G.seasonStart=startYear;
G.season=`${startYear}-${String(startYear+1).slice(2)}`;

G.teams=makeTeams();
G.schedule=makeSchedule();
G.lastResult=null;
log(`--- B.PREMIER 新シーズン (${G.season}) が開幕しました ---`);
saveGame();render();
}

function act(action,id){
if(action==="firstgame"){
createNewGame($("firstClub")?.value||"信州ブレイブウォリアーズ");render();return;
}
if(action==="newgame"){
if(!confirm("新規ゲームを開始しますか？"))return;
G=null;
try{localStorage.removeItem(SAVE_KEY);}catch(e){}
PAGE="home";render();return;
}
if(!validGame(G)){alert("ゲームを開始してください。");render();return;}
if(action==="save"){alert(saveGame()?"セーブしました。":"保存できませんでした。");return;}
if(action==="changeclub"){
const name=$("clubSelect")?.value;
if(!name)return;
G.club=name;log("操作クラブを"+name+"に変更");saveGame();render();
alert("操作クラブを変更しました。");return;
}
if(action==="extend"){
const p=G.roster.find(x=>x.id===id);
if(!p)return alert("選手が見つかりません。");
const n=Number(prompt(`${p.name}選手の契約延長年数（1～3年）`,"1"));
if(!Number.isInteger(n)||n<1||n>3)return;
p.years+=n;log(`${p.name}選手と${n}年延長`);saveGame();render();return;
}
if(action==="release"){
const i=G.roster.findIndex(p=>p.id===id);
if(i<0)return alert("選手が見つかりません。");
const p=G.roster[i];
if(!confirm(`${p.name}選手との契約を解除しますか？`))return;
G.roster.splice(i,1);G.market.push(p);
log(`${p.name}選手を契約解除`);saveGame();render();return;
}
if(action==="sign"){
const i=G.market.findIndex(p=>p.id===id);
if(i<0)return alert("選手が見つかりません。");
const p=G.market[i];
if(G.roster.length>=14)return alert("登録人数上限（14名）に達しています。");
if(p.type==="外国籍"&&foreignCount()>=3)return alert("外国籍選手は3名までです。");
if(["帰化","アジア特別枠"].includes(p.type)&&specialCount()>=1)return alert("帰化/アジア特別枠は1名までです。");

const nextCapSalary = capCalculatedSalary() + (p.salary > 15000 ? 15000 : p.salary);
if(nextCapSalary > 80000)return alert("サラリーキャップ8億円を超過します。");

const fee=Math.round(p.salary*.1);
if(G.cash<p.salary+fee)return alert("資金が不足しています。");
if(!confirm(`${p.name}選手と契約しますか？\n年俸 ${yen(p.salary)}\n契約金 ${yen(fee)}`))return;
G.cash-=(p.salary+fee);G.roster.push(p);G.market.splice(i,1);
log(`${p.name}選手と契約（オンザコートフリー枠活用）`);saveGame();render();return;
}
if(action==="hirecoach"){
const i=G.coachMarket.findIndex(c=>c.id===id);
if(i<0)return alert("コーチが見つかりません。");
const c=G.coachMarket[i];
if(G.coaches.some(x=>x.role===c.role))return alert(`${c.role}は契約中です。`);
if(G.cash<c.salary)return alert("資金が不足しています。");
if(!confirm(`${c.name}（${c.role}）と契約しますか？`))return;
G.cash-=c.salary;G.coaches.push(c);G.coachMarket.splice(i,1);
log(`${c.name}コーチと契約`);saveGame();render();return;
}
if(action==="firecoach"){
const i=G.coaches.findIndex(c=>c.id===id);
if(i<0)return alert("コーチが見つかりません。");
const c=G.coaches[i];
if(!confirm(`${c.name}コーチとの契約を解除しますか？`))return;
G.coaches.splice(i,1);G.coachMarket.push(c);
log(`${c.name}コーチを契約解除`);saveGame();render();return;
}
if(action==="savefinance"){
const t=Number($("ticketInput")?.value),a=Number($("attendanceInput")?.value);
if(!Number.isFinite(t)||t<500||t>30000||!Number.isFinite(a)||a<0||a>20000)return alert("入力値を確認してください。");
G.ticket=Math.round(t);G.attendance=Math.round(a);
log("財務設定を変更");saveGame();render();return;
}
if(action==="nextgame"){simulateGame();return;}
if(action==="nextseason"){processNextSeason();return;}
}

document.addEventListener("change",e=>{
if(e.target.id==="divisionFilter"){
window.currentDivision=e.target.value;render();
}
});

document.addEventListener("click",e=>{
const b=e.target.closest("button");
if(!b)return;
if(b.dataset.page){PAGE=b.dataset.page;render();return;}
if(b.dataset.act){
try{act(b.dataset.act,b.dataset.id||"");}
catch(err){console.error(err);alert("エラーが発生しました："+err.message);}
}
});

if(!loadGame())G=null;
render();
</script>
</body>
</html>
