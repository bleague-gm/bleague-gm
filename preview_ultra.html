<title>B.LEAGUE GM ULTRA - Real Rosters & Speed Edition</title>
<style>
:root{--bg:#070d16;--card:#0f1a2e;--card-border:#1f3352;--text:#e8f0fe;--muted:#8aa2c0;--primary:#f1c40f;--danger:#e74c3c;--success:#2ecc71;--accent:#3498db}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding-bottom:65px}

.top-status-bar{background:#04080f;padding:6px 12px;font-size:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #142238;white-space:nowrap;overflow-x:auto}
.top-status-bar::-webkit-scrollbar{height:0px}
.status-item{display:flex;align-items:center;gap:4px;color:var(--muted)}
.status-item b{color:var(--text)}

header{background:#091424;padding:10px 14px;border-bottom:2px solid var(--primary);display:flex;justify-content:space-between;align-items:center}
h1{font-size:14px;margin:0;display:flex;align-items:center;gap:6px;color:var(--primary)}
header p{margin:2px 0 0;color:var(--muted);font-size:9px}

nav{display:flex;overflow-x:auto;gap:4px;padding:6px 8px;background:#04080f;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--card-border)}
nav::-webkit-scrollbar{height:4px}
nav::-webkit-scrollbar-thumb{background:#1f3352;border-radius:2px}
button{border:0;border-radius:6px;padding:8px 12px;background:#1a2c44;color:white;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;transition:filter 0.2s}
button:hover{filter:brightness(1.2)}
button.primary{background:var(--primary);color:#111}
button.danger{background:var(--danger)}
button.success{background:var(--success);color:#111}
button:disabled{opacity:.4;cursor:not-allowed}

main{padding:10px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--card-border);padding-bottom:6px;color:var(--primary)}
h3{font-size:12px;margin:8px 0 4px;color:var(--text)}
.muted{color:var(--muted);font-size:11px}

.arena-banner{background:linear-gradient(135deg, #091424 0%, #132744 100%);border:1px solid var(--card-border);border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
.arena-banner h3{font-size:16px;color:var(--primary);margin:0 0 4px}
.arena-banner p{font-size:11px;color:var(--muted);margin:0}

.date-advance-box{background:#0b1526;border:1px solid #1c3150;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.date-display{font-size:15px;font-weight:bold;color:var(--primary);margin-bottom:8px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat-box{background:#070d16;border-radius:8px;padding:8px;font-size:11px;border:1px solid #142238}
.stat-box strong{display:block;font-size:16px;margin-top:2px;color:var(--primary)}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task-item{background:#091424;border:1px solid #1a2c44;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.task-info{min-width:0;flex:1}
.task-info strong{display:block;font-size:13px;color:var(--text)}
.task-info small{color:var(--muted);display:block;margin-top:2px;font-size:11px}

.player-item{background:#091424;border:1px solid #1a2c44;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.player-info{min-width:0;flex:1}
.player-info strong{display:block;font-size:13px}
.player-info small{color:var(--muted);display:block;margin-top:2px;font-size:11px}
.player-actions{display:flex;gap:4px;flex-wrap:wrap}

input,select{background:#070d16;color:white;border:1px solid #1f3352;border-radius:6px;padding:8px;width:100%;font-size:13px}
label{display:block;margin:8px 0}
label span{display:block;font-size:12px;margin-bottom:4px;color:var(--muted)}

.notice{background:#112036;border-left:3px solid var(--primary);border-radius:4px;padding:8px;font-size:11px;margin:8px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:6px 4px;border-bottom:1px solid #1a2c44;text-align:center;white-space:nowrap}
th{background:#091424;color:var(--muted)}
.highlight{background:#2a2512}

.pill{display:inline-block;border-radius:10px;background:#142238;padding:2px 6px;font-size:10px;color:var(--muted)}
.pill.gold{background:#3d2e0e;color:var(--primary);border:1px solid var(--primary)}
.pill.danger{background:#3d1313;color:var(--danger);border:1px solid var(--danger)}
.pill.success{background:#103822;color:var(--success);border:1px solid var(--success)}

.scoreboard{background:#070d16;border:1px solid var(--card-border);border-radius:10px;padding:12px;text-align:center;margin-top:8px}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}
.team-score{font-size:30px;font-weight:900;color:var(--primary)}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:420px;margin:8px auto}
.periods div{padding:4px 2px;background:#0f1a2e;border-radius:4px;font-size:10px}
.logline{border-bottom:1px solid #142238;padding:6px 0;font-size:11px}

.news-box{background:#091424;border:1px solid #1a2c44;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color 0.2s}
.news-box:hover{border-color:var(--primary)}
.news-box small{color:var(--muted)}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:100;padding:16px}
.modal-content{background:#0d1829;border:1px solid var(--primary);border-radius:14px;padding:20px;max-width:550px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,0.7);max-height:90vh;overflow-y:auto}
footer{color:var(--muted);text-align:center;padding:15px;font-size:11px}

@media(min-width:650px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

division:EAST.includes(name)?"東地区":"西地区",
wins:0,losses:0,played:0,pf:0,pa:0
}));
}

function makeSchedule(){
const games=[];
let gameId=1;
for(let r=0; r<60; r++){
  const roundGames=[];
  const paired=new Set();
  const rotation = TEAM_NAMES.map((_,i)=>TEAM_NAMES[(i+r)%26]);
  
  for(let i=0; i<13; i++){
    let home=rotation[i], away=rotation[25-i];
    if(r%2===1){ const t=home; home=away; away=t; }
    if(!paired.has(home) && !paired.has(away) && home!==away){
      paired.add(home); paired.add(away);
      roundGames.push({home, away, done:false, round:r+1, dateStr:SEASON_DATES[r], id:gameId++});
    }
  }
  const unmatched = TEAM_NAMES.filter(t=>!paired.has(t));
  for(let i=0; i<unmatched.length; i+=2){
    if(i+1 < unmatched.length){
      let home=unmatched[i], away=unmatched[i+1];
      roundGames.push({home, away, done:false, round:r+1, dateStr:SEASON_DATES[r], id:gameId++});
    }
  }
  games.push(...roundGames);
}
return games;
}

function generateDraftClass(){
  const posList=["PG","SG","SF","PF","C"];
  const names=["佐藤 健太","鈴木 翔","高橋 蓮","田中 悠人","伊藤 陽翔","渡辺 湊","山本 陸","中村 樹","小林 蒼","加藤 蓮"];
  const list=[];
  for(let i=0; i<8; i++){
    const name = names[Math.floor(Math.random()*names.length)] + " (" + (i+1) + ")";
    const pos = posList[Math.floor(Math.random()*posList.length)];
    const rating = Math.floor(74 + Math.random()*12);
    const salary = Math.floor(2000 + Math.random()*2500);
    const age = Math.floor(18 + Math.random()*3);
    list.push(makePlayer(name, pos, rating, salary, 3, "日本人", age));
  }
  return list;
}

G={
club,gmName,seasonStart:2026,season:"2026-27",
fans:1250000,fanSatisfy:85,

function validGame(g){
return !!g && Array.isArray(g.roster) && Array.isArray(g.market) && Array.isArray(g.teams) && typeof g.cash==="number";
}

function saveGame(){
try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true;}catch(e){return false;}
}

function loadGame(){
try{
let raw=localStorage.getItem(SAVE_KEY);
if(!raw)return false;
let x=JSON.parse(raw);
if(!validGame(x))return false;
G=x;
if(!G.simSpeed) G.simSpeed = "normal";
return true;
}catch(e){return false;}
}

function log(s){
if(!G || !Array.isArray(G.log)) return;
G.log.unshift(new Date().toLocaleTimeString("ja-JP",{hour:"numeric",minute:"numeric"})+" "+s);
G.log=G.log.slice(0,50);
}

function capCalculatedSalary(){
if(!G || !Array.isArray(G.roster)) return 0;
return G.roster.reduce((sum,p)=>{let sal=Number(p.salary)||0;return sum + (sal > 15000 ? 15000 : sal);},0);
}
function rawSalaryTotal(){ return G && Array.isArray(G.roster) ? G.roster.reduce((s,p)=>s+(Number(p.salary)||0),0) : 0; }
function foreignCount(){return G && Array.isArray(G.roster) ? G.roster.filter(p=>p.type==="外国籍").length : 0;}
function specialCount(){return G && Array.isArray(G.roster) ? G.roster.filter(p=>["アジア特別枠","帰化"].includes(p.type)).length : 0;}
function starCount(roster){return roster.filter(p=>(Number(p.salary)||0)>=15000).length;}
function cap(){return{salary:capCalculatedSalary(),rawSalary:rawSalaryTotal(),cap:80000,floor:50000};}

<div class="status-item"><span>GM</span> <b>${esc(G.gmName||"GM")}</b></div>

<div class="status-item"><span>現金</span> <b style="color:var(--primary)">${cashB}</b></div>
`;
}

function calculateTeamPower(teamName){
if(teamName===G.club){
  const activeRoster = G.roster.filter(p=>p.injury<=0);
  const sorted = [...activeRoster].sort((a,b)=>b.rating-a.rating);
  const top5 = sorted.slice(0,5);
  const base = top5.reduce((s,p)=>s+p.rating,0) / Math.max(1, top5.length);
  const cBonus = G.coaches.reduce((s,c)=>s+(c.rating-70)*.1, 0);
  return base + cBonus;
} else {
  const roster = REAL_ROSTERS[teamName];
  if(!roster) return 80;
  const sorted = [...roster].sort((a,b)=>b.rating-a.rating);
  const top5 = sorted.slice(0,5);
  return top5.reduce((s,p)=>s+p.rating,0) / Math.max(1, top5.length);
}
}

function simulateGame(){
const currentRound=G.week||1;
if(currentRound>60){alert("シーズン終了しています。");return;}
const roundGames=G.schedule.filter(g=>g.round===currentRound);
const dateStr=SEASON_DATES[currentRound-1] || "";

G.roster.forEach(p=>{if(p.injury>0)p.injury--;});

let myTeamMatchRes=null;

roundGames.forEach(g=>{
let isHome=g.home===G.club;
let isAway=g.away===G.club;

let hPow=calculateTeamPower(g.home);
let aPow=calculateTeamPower(g.away);

let hs=0,as=0,periods=[];
for(let q=0;q<4;q++){
let h=Math.max(14,Math.round(21+Math.random()*8+(hPow-75)*.25));
let a=Math.max(14,Math.round(20+Math.random()*8+(aPow-75)*.25));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){as+=1;periods[3][1]++;}
g.done=true;g.result={hs,as};

for(const [name,score,against] of [[g.home,hs,as],[g.away,as,hs]]){
const t=G.teams.find(x=>x.name===name);
if(t){t.played++;t.pf+=score;t.pa+=against;if(score>against)t.wins++;else t.losses++;}
}

if(isHome||isAway){
const arena = ARENAS[g.home] || {name:"アリーナ", cap:5000};
const attendance = Math.min(arena.cap, Math.round(G.attendance * (0.95 + Math.random() * 0.1)));
const attendanceRate = Math.round((attendance / arena.cap) * 100);

const ticketRev = isHome ? Math.round(attendance * (G.ticket || 4000) / 800) : 0;
const goodsRev = isHome ? Math.round(ticketRev * 0.45) : 0;
const expenses = Math.round(600 + rawSalaryTotal() / 140);
const profit = (ticketRev + goodsRev) - expenses;

G.cash += profit;
let isWin = (isHome && hs > as) || (isAway && as > hs);
G.fans = Math.round(G.fans + (isWin ? 1800 : -500));
G.fanSatisfy = Math.min(100, Math.max(20, G.fanSatisfy + (isWin ? 1 : -2)));

myTeamMatchRes = {
  home: g.home, away: g.away, hs, as, periods,
  venue: `${arena.name} (${arena.cap.toLocaleString()}人収容)`,
  attendance, attendanceRate, ticketRev, goodsRev, expenses, profit
};
}
});

if(myTeamMatchRes) G.lastResult = myTeamMatchRes;
G.week++;
if(G.week>60){G.phase="off";}
saveGame();

// 速度に応じた挙動分岐
if(G.simSpeed === "skip"){
  render();
} else if(G.simSpeed === "fast"){
  setTimeout(()=>{ render(); }, 150);
} else {
  showSecretaryReportModal(myTeamMatchRes || {home:G.club,away:"対戦相手",hs:0,as:0,periods:[[0,0],[0,0],[0,0],[0,0]],venue:"アリーナ",attendance:4000,attendanceRate:80,ticketRev:0,goodsRev:0,expenses:0,profit:0});
}
}

function startCS(){
G.phase="cs"; G.csStage="quarter"; saveGame(); render();
}

function simulateCS(){
let hPow=calculateTeamPower(G.club);
let aPow=82;
let hs=0,as=0,periods=[];
for(let q=0;q<4;q++){
let h=Math.max(15,Math.round(22+Math.random()*8+(hPow-75)*.25));
let a=Math.max(15,Math.round(21+Math.random()*8+(aPow-75)*.25));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){as+=1;periods[3][1]++;}
let isWin = hs > as;
const homeArenaInfo = ARENAS[G.club] || {name:"アリーナ", cap:5000};
G.csResult={home:G.club,away:"ライバルクラブ",hs,as,periods,venue:`${homeArenaInfo.name} (CS)`,attendance:8000,attendanceRate:100,ticketRev:10000,goodsRev:5000,expenses:1200,profit:13800};
G.cash+=13800;

if(isWin){
if(G.csStage==="quarter"){G.csStage="semi";}
else if(G.csStage==="semi"){G.csStage="finals";}
else{alert("🏆 チャンピオンシップ優勝！");G.phase="off";}
}else{alert("CS敗退…オフシーズンへ");G.phase="off";}
saveGame();render();
}

function processNextSeason(){
if(!confirm("新シーズンへ移行しますか？"))return;
G.roster.forEach(p=>{
  p.age = (p.age || 25) + 1;
  p.years--;
  if(p.age<=25) p.rating=Math.min(99,p.rating+Math.floor(1+Math.random()*3));
  else if(p.age>=34) p.rating=Math.max(65,p.rating-Math.floor(1+Math.random()*3));
});
G.roster=G.roster.filter(p=>p.years>0);
const startYear=parseInt(G.seasonStart)+1;
G.seasonStart=startYear; G.season=`${startYear}-${String(startYear+1).slice(2)}`;
G.teams=makeTeams(); G.schedule=makeSchedule(); G.week=1; G.phase="regular";
G.csStage=null; G.csResult=null; G.lastResult=null; G.draftClass=[];
saveGame();render();
}

function act(action,id){
if(action==="firstgame"){createNewGame($("firstClub")?.value||"信州ブレイブウォリアーズ", $("firstGmName")?.value.trim()||"マイケル");render();return;}
if(action==="newgame"){if(!confirm("リセットしますか？"))return;G=null;localStorage.removeItem(SAVE_KEY);render();return;}
if(action==="setspeed"){G.simSpeed=id;saveGame();render();return;}
if(!validGame(G)){return;}
if(action==="save"){alert(saveGame()?"セーブしました":"失敗");return;}
if(action==="gopage"){PAGE=id;render();return;}
if(action==="st-east"){window.standingsTab="EAST";render();return;}
if(action==="st-west"){window.standingsTab="WEST";render();return;}
if(action==="opendraft"){G.draftClass=generateDraftClass();saveGame();render();return;}
if(action==="signdraft"){
const i=G.draftClass.findIndex(p=>p.id===id);
if(i<0)return;
const p=G.draftClass[i];
if(G.roster.length>=14)return alert("ロスター上限");
G.cash-=p.salary; G.roster.push(p); G.draftClass.splice(i,1);
saveGame();render();alert(`${p.name}獲得！`);return;
}
if(action==="shownews"){
const n=G.news.find(x=>x.id===id);
if(!n)return;
$("modalContainer").innerHTML=`<div class="modal-overlay"><div class="modal-content"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><button class="primary" onclick="$('modalContainer').innerHTML=''" style="width:100%">閉じる</button></div></div>`;
return;
}
if(action==="changeclub"){
G.club=$("clubSelect")?.value; G.gmName=$("gmNameInput")?.value.trim()||"マイケル";
if(REAL_ROSTERS[G.club]) G.roster=JSON.parse(JSON.stringify(REAL_ROSTERS[G.club]));
saveGame();render();alert("保存しました");return;
}
if(action==="extend"){
const p=G.roster.find(x=>x.id===id);
if(!p)return;
p.years+=Number(prompt("延長年数(1-3)", "1")||1);saveGame();render();return;
}
if(action==="release"){
const i=G.roster.findIndex(p=>p.id===id);
if(i<0)return;
G.roster.splice(i,1);saveGame();render();return;
}
if(action==="sign"){
const i=G.market.findIndex(p=>p.id===id);
if(i<0)return;
const p=G.market[i];
if(G.roster.length>=14)return alert("ロスター上限");
G.cash-=p.salary; G.roster.push(p); G.market.splice(i,1);
saveGame();render();alert(`${p.name}と契約！`);return;
}
if(action==="savefinance"){
G.ticket=Number($("ticketInput")?.value); G.attendance=Number($("attendanceInput")?.value);
saveGame();render();alert("保存しました");return;
}
if(action==="nextgame"){simulateGame();return;}
if(action==="startcs"){startCS();return;}
if(action==="simulatecs"){simulateCS();return;}
if(action==="nextseason"){processNextSeason();return;}
}

document.addEventListener("click",e=>{
const b=e.target.closest("button") || e.target.closest(".news-box") || e.target.closest(".task-item");
if(!b)return;
if(b.dataset.page){PAGE=b.dataset.page;render();return;}
if(b.dataset.act){try{act(b.dataset.act,b.dataset.id||"");}catch(err){}}
});

if(!loadGame())G=null;
render();
