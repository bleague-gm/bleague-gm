
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B.LEAGUE GM ULTRA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif}
header{background:#18263c;padding:18px 14px;border-bottom:2px solid #e0a83c}
h1{font-size:22px;margin:0}
header p{margin:6px 0 0;color:#b8c5db;font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:#111c2d;position:sticky;top:0;z-index:2}
button{border:0;border-radius:8px;padding:10px 12px;background:#30445f;color:white;font-weight:700;cursor:pointer}
button.primary{background:#d69a2d;color:#171717}
button.danger{background:#9f3947}
button:disabled{opacity:.45}
main{padding:14px;max-width:1000px;margin:auto}
.card{background:#1a2940;border:1px solid #344761;border-radius:12px;padding:14px;margin:0 0 13px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 7px}
.muted{color:#aebdd2;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{background:#111c2d;border-radius:9px;padding:12px}
.stat strong{display:block;font-size:20px;margin-top:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #344761;padding:12px 0}
.player-info{min-width:0;flex:1}
.player-info strong{display:block}
.player-info small{color:#aebdd2;display:block;margin-top:4px}
.player-actions{display:flex;gap:5px;flex-wrap:wrap}
input,select{background:#101827;color:white;border:1px solid #50627b;border-radius:7px;padding:9px;max-width:100%}
label{display:block;margin:9px 0}
label span{display:block;font-size:13px;margin-bottom:5px;color:#c5d1e2}
.notice{background:#243b51;border-radius:8px;padding:10px;font-size:13px}
footer{color:#8292aa;text-align:center;padding:25px;font-size:12px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>🏀 B.LEAGUE GM ULTRA</h1>
<p>クラブ経営・選手契約シミュレーション</p>
</header>

<nav>
<button data-page="home">ホーム</button>
<button data-page="roster">選手・契約</button>
<button data-page="market">選手市場</button>
<button data-page="finance">経営・財務</button>
<button data-page="season">シーズン</button>
<button data-page="settings">設定</button>
</nav>

<main id="app"></main>
<footer>B.LEAGUE GM ULTRA / シングルHTML版</footer>

<script>
"use strict";

const SAVE_KEY = "bleague_gm_ultra_standalone_v1";
let G = null;
let PAGE = "home";

const $ = id => document.getElementById(id);
const yen = n => Math.round(n).toLocaleString("ja-JP") + "万円";

function makePlayer(name,pos,rating,salary,years=1,type="日本人"){
  return {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,8),
    name,pos,rating,salary,years,type
  };
}

function createNewGame(){
  G = {
    club:"信州ブレイブウォリアーズ",
    season:"2026-27",
    cash:300000,
    ticket:2500,
    attendance:3500,
    wins:0,
    losses:0,
    games:0,
    roster:[
      makePlayer("田中 大地","PG",76,3500,2),
      makePlayer("佐藤 悠斗","SG",75,3200,2),
      makePlayer("高橋 陸","SF",77,4000,2),
      makePlayer("山本 健","PF",76,3800,2),
      makePlayer("鈴木 海斗","C",78,4500,2),
      makePlayer("渡辺 翔","PG",73,2500,1),
      makePlayer("伊藤 蓮","SG",74,2800,1),
      makePlayer("小林 蒼","SF",72,2200,2),
      makePlayer("加藤 颯","PF",73,2600,1),
      makePlayer("吉田 誠","C",72,2400,1)
    ],
    market:[
      makePlayer("Marcus Reid","PF",87,12000,1,"外国籍"),
      makePlayer("Jaylen Carter","SG/SF",87,8500,1,"外国籍"),
      makePlayer("Eric Johnson","C",83,6000,1,"外国籍"),
      makePlayer("朝倉 蒼真","PG",84,6500,2),
      makePlayer("神谷 蓮","SF",86,9000,2),
      makePlayer("森下 悠真","SG/SF",82,4500,2),
      makePlayer("李 明","SF",79,4000,2,"アジア特別枠")
    ],
    coach:{name:"初期HC",rating:70,salary:3000},
    log:["新しいゲームを開始しました。"]
  };
  saveGame();
}

function validGame(g){
  return !!g &&
    Array.isArray(g.roster) &&
    Array.isArray(g.market) &&
    typeof g.cash === "number";
}

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(G));
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const parsed=JSON.parse(raw);
    if(!validGame(parsed))return false;
    G=parsed;
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

function log(message){
  G.log.unshift(new Date().toLocaleString("ja-JP")+" "+message);
  G.log=G.log.slice(0,50);
}

function salaryTotal(){
  return G.roster.reduce((sum,p)=>sum+p.salary,0);
}

function foreignCount(roster){
  return roster.filter(p=>p.type==="外国籍").length;
}

function specialCount(roster){
  return roster.filter(p=>p.type==="アジア特別枠"||p.type==="帰化").length;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function button(label,action,id="",cls=""){
  return `<button class="${cls}" data-act="${action}" data-id="${escapeHTML(id)}">${label}</button>`;
}

function homePage(){
  return `
  <section class="card">
    <h2>${escapeHTML(G.club)}</h2>
    <p class="muted">${escapeHTML(G.season)} シーズン</p>
    <div class="stats">
      <div class="stat">手元資金<strong>${yen(G.cash)}</strong></div>
      <div class="stat">選手年俸合計<strong>${yen(salaryTotal())}</strong></div>
      <div class="stat">レギュラーシーズン<strong>${G.wins}勝 ${G.losses}敗</strong></div>
      <div class="stat">登録選手<strong>${G.roster.length}人</strong></div>
    </div>
  </section>
  <section class="card">
    <h2>クラブ状況</h2>
    <p>チケット価格：${G.ticket.toLocaleString()}円</p>
    <p>HC：${escapeHTML(G.coach.name)}（能力 ${G.coach.rating}）</p>
    <p>外国籍選手：${foreignCount(G.roster)}人 / アジア特別・帰化枠：${specialCount(G.roster)}人</p>
    <div class="row">
      <button class="primary" data-page="market">選手を補強する</button>
      <button data-page="roster">契約を管理する</button>
      <button data-page="season">試合・シーズン進行</button>
    </div>
  </section>
  <section class="card">
    <h2>最近の記録</h2>
    ${G.log.slice(0,8).map(x=>`<p class="muted">${escapeHTML(x)}</p>`).join("")}
  </section>`;
}

function rosterPage(){
  return `
  <section class="card">
    <h2>選手・契約管理</h2>
    <p class="muted">契約延長で契約年数を追加し、契約解除で選手を放出します。</p>
    <p>登録人数：${G.roster.length}人 / 年俸合計：${yen(salaryTotal())}</p>
    ${G.roster.length===0?'<p>登録選手はいません。</p>':G.roster.map(p=>`
      <div class="player">
        <div class="player-info">
          <strong>${escapeHTML(p.name)}（${escapeHTML(p.pos)}）</strong>
          <small>能力 ${p.rating} / 年俸 ${yen(p.salary)} / 残り契約 ${p.years}年 / ${escapeHTML(p.type)}</small>
        </div>
        <div class="player-actions">
          ${button("契約延長","extend",p.id)}
          ${button("契約解除","release",p.id,"danger")}
        </div>
      </div>`).join("")}
  </section>`;
}

function marketPage(){
  return `
  <section class="card">
    <h2>選手市場</h2>
    <p class="muted">獲得時には年俸と契約金を支払います。予算・登録人数・外国籍枠を確認してください。</p>
    <div class="stats">
      <div class="stat">手元資金<strong>${yen(G.cash)}</strong></div>
      <div class="stat">年俸合計<strong>${yen(salaryTotal())}</strong></div>
      <div class="stat">登録人数<strong>${G.roster.length}/14</strong></div>
      <div class="stat">外国籍枠<strong>${foreignCount(G.roster)}/3</strong></div>
    </div>
    ${G.market.length===0?'<p>市場に選手はいません。</p>':G.market.map(p=>`
      <div class="player">
        <div class="player-info">
          <strong>${escapeHTML(p.name)}（${escapeHTML(p.pos)}）</strong>
          <small>能力 ${p.rating} / 年俸 ${yen(p.salary)} / 契約 ${p.years}年 / ${escapeHTML(p.type)}</small>
        </div>
        ${button("獲得","sign",p.id,"primary")}
      </div>`).join("")}
  </section>`;
}

function financePage(){
  return `
  <section class="card">
    <h2>経営・財務</h2>
    <p>手元資金：<strong>${yen(G.cash)}</strong></p>
    <p>選手年俸合計：${yen(salaryTotal())}</p>
    <p>現在のチケット価格：${G.ticket.toLocaleString()}円</p>
    <label><span>チケット価格（円）</span>
      <input id="ticketInput" type="number" min="500" max="20000" step="100" value="${G.ticket}">
    </label>
    <button class="primary" data-act="ticket">チケット価格を変更</button>
    <div class="notice">この簡易版の金額はゲーム内のシミュレーション値です。実際のクラブの財務情報ではありません。</div>
  </section>`;
}

function seasonPage(){
  return `
  <section class="card">
    <h2>シーズン進行</h2>
    <p>現在のシーズン：${escapeHTML(G.season)}</p>
    <p>成績：${G.wins}勝 ${G.losses}敗</p>
    <p>消化試合：${G.games}/60</p>
    <button class="primary" data-act="game" ${G.games>=60?"disabled":""}>次の試合を行う</button>
    <button data-act="nextseason" ${G.games<60?"disabled":""}>次シーズンへ進む</button>
    <p class="muted">試合進行は簡易シミュレーションです。実際の試合結果ではありません。</p>
  </section>`;
}

function settingsPage(){
  return `
  <section class="card">
    <h2>ゲーム設定</h2>
    <p>ゲームデータは、このブラウザのローカルストレージに保存されます。</p>
    <div class="row">
      <button data-act="save" class="primary">手動セーブ</button>
      <button data-act="newgame" class="danger">新規ゲーム</button>
    </div>
    <p class="muted">新規ゲームを開始すると、現在のゲームデータは置き換わります。</p>
  </section>`;
}

function render(){
  if(!validGame(G)){
    $("app").innerHTML=`
      <section class="card">
        <h2>ゲームを開始</h2>
        <p>新しいクラブ経営を始めます。</p>
        <button class="primary" data-act="newgame">新規ゲーム開始</button>
      </section>`;
    return;
  }

  const pages={
    home:homePage,
    roster:rosterPage,
    market:marketPage,
    finance:financePage,
    season:seasonPage,
    settings:settingsPage
  };
  $("app").innerHTML=(pages[PAGE]||homePage)();
}

function act(action,id){
  if(action==="newgame"){
    if(!confirm("新しいゲームを開始しますか？現在のセーブデータは上書きされます。"))return;
    createNewGame();
    PAGE="home";
    render();
    alert("新規ゲームを開始しました。");
    return;
  }

  if(!validGame(G)){
    alert("ゲームデータがありません。新規ゲームを開始してください。");
    render();
    return;
  }

  if(action==="save"){
    alert(saveGame()?"セーブしました。":"保存できませんでした。");
    return;
  }

  if(action==="ticket"){
    const input=$("ticketInput");
    const value=Number(input&&input.value);
    if(!Number.isFinite(value)||value<500||value>20000){
      alert("チケット価格は500～20,000円で入力してください。");
      return;
    }
    G.ticket=Math.round(value);
    log("チケット価格を"+G.ticket+"円に変更");
    saveGame();
    render();
    alert("チケット価格を変更しました。");
    return;
  }

  if(action==="extend"){
    const p=G.roster.find(x=>x.id===id);
    if(!p){alert("対象選手が見つかりません。");return;}
    const extra=Number(prompt(p.name+"選手の契約を何年延長しますか？（1～3年）","1"));
    if(!Number.isInteger(extra)||extra<1||extra>3)return;
    const cost=p.salary*extra;
    if(!confirm(p.name+"選手の契約を"+extra+"年延長しますか？\n年俸基準額："+yen(cost))){
      return;
    }
    p.years+=extra;
    log(p.name+"選手と"+extra+"年の契約延長");
    saveGame();
    render();
    alert("契約を延長しました。");
    return;
  }

  if(action==="release"){
    const index=G.roster.findIndex(x=>x.id===id);
    if(index<0){alert("対象選手が見つかりません。");return;}
    const p=G.roster[index];
    if(!confirm(p.name+"選手との契約を解除しますか？"))return;
    G.roster.splice(index,1);
    G.market.push(p);
    log(p.name+"選手との契約を解除");
    saveGame();
    render();
    alert("契約を解除しました。");
    return;
  }

  if(action==="sign"){
    const index=G.market.findIndex(x=>x.id===id);
    if(index<0){alert("対象選手が見つかりません。");return;}
    const p=G.market[index];

    if(G.roster.length>=14){
      alert("登録人数は最大14人です。先に選手を放出してください。");
      return;
    }
    if(G.roster.some(x=>x.name===p.name)){
      alert("この選手はすでに登録されています。");
      return;
    }
    if(p.type==="外国籍"&&foreignCount(G.roster)>=3){
      alert("外国籍選手の登録上限に達しています。");
      return;
    }
    if((p.type==="アジア特別枠"||p.type==="帰化")&&specialCount(G.roster)>=1){
      alert("アジア特別・帰化枠の登録上限に達しています。");
      return;
    }

    const fee=Math.round(p.salary*0.1);
    const total=p.salary+fee;
    if(salaryTotal()+p.salary>80000){
      alert("年俸予算の上限（8億円）を超えます。");
      return;
    }
    if(G.cash<total){
      alert("手元資金が不足しています。必要額："+yen(total));
      return;
    }
    if(!confirm(p.name+"選手を獲得しますか？\n年俸："+yen(p.salary)+"\n契約金："+yen(fee)+"\n合計："+yen(total))){
      return;
    }

    G.cash-=total;
    G.roster.push(p);
    G.market.splice(index,1);
    log(p.name+"選手と契約。支出："+yen(total));
    saveGame();
    render();
    alert("選手を獲得しました。");
    return;
  }

  if(action==="game"){
    if(G.games>=60)return;
    const power=G.roster.reduce((s,p)=>s+p.rating,0)/Math.max(1,G.roster.length);
    const winChance=Math.max(0.15,Math.min(0.85,0.5+(power-75)*0.025));
    const win=Math.random()<winChance;
    G.games++;
    if(win)G.wins++;else G.losses++;

    const revenue=Math.round(G.attendance*G.ticket/10000);
    const expenses=1800+salaryTotal()/60;
    const profit=revenue-expenses;
    G.cash+=profit;
    log((G.games)+"試合目："+(win?"勝利":"敗北")+" / 収支 "+(profit>=0?"+":"")+yen(profit));
    saveGame();
    render();
    alert((win?"勝利！":"敗北…")+"\n試合："+G.games+"/60\n試合収支："+(profit>=0?"+":"")+yen(profit));
    return;
  }

  if(action==="nextseason"){
    if(G.games<60){
      alert("60試合終了後に進めます。");
      return;
    }
    if(!confirm("次のシーズンに進みますか？"))return;
    G.season=String(Number(G.season.slice(0,4))+1)+"-"+String((Number(G.season.slice(0,4))+1+1)%100).padStart(2,"0");
    G.games=0;
    G.wins=0;
    G.losses=0;
    G.roster.forEach(p=>{p.years=Math.max(0,p.years-1);});
    const expired=G.roster.filter(p=>p.years===0);
    expired.forEach(p=>G.market.push(p));
    G.roster=G.roster.filter(p=>p.years>0);
    log("次シーズン開始："+G.season);
    saveGame();
    PAGE="home";
    render();
    alert("次のシーズンを開始しました。");
    return;
  }
}

/*
 * クリックイベントをdocumentに1回だけ登録。
 * innerHTMLで画面を作り直しても、ボタン操作が失われません。
 */
document.addEventListener("click",function(event){
  const buttonElement=event.target.closest("button");
  if(!buttonElement)return;

  if(buttonElement.dataset.page){
    PAGE=buttonElement.dataset.page;
    render();
    return;
  }

  const action=buttonElement.dataset.act;
  if(action){
    try{
      act(action,buttonElement.dataset.id||"");
    }catch(error){
      console.error("操作エラー:",error);
      alert("操作中にエラーが発生しました。\n"+(error.message||error));
    }
  }
});

if(!loadGame()){
  G=null;
  PAGE="home";
}else{
  PAGE="home";
}
render();
</script>
</body>
</html>
