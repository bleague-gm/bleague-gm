<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.LEAGUE GM ULTRA - Free Agent Edition</title>
<style>
:root{--bg:#0b1320;--card:#131f33;--card-border:#243652;--text:#e2ebf9;--muted:#94a8c4;--primary:#f5b041;--danger:#e74c3c;--accent:#3498db;--success:#2ecc71}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding-bottom:50px}
header{background:#0f1a2e;padding:12px 16px;border-bottom:2px solid var(--primary);display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
header p{margin:2px 0 0;color:var(--muted);font-size:10px}
.top-bar{background:#09101d;padding:8px 16px;font-size:11px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--card-border);overflow-x:auto}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px;background:#09101d;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--card-border)}
nav::-webkit-scrollbar{height:4px}
nav::-webkit-scrollbar-thumb{background:#243652;border-radius:2px}
button{border:0;border-radius:6px;padding:8px 12px;background:#1e2f4a;color:white;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;transition:brightness 0.2s}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--primary);color:#111}
button.danger{background:var(--danger)}
button.success{background:var(--success);color:#111}
button:disabled{opacity:.4;cursor:not-allowed}
main{padding:12px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--card-border);padding-bottom:6px}
h3{font-size:13px;margin:10px 0 6px;color:var(--primary)}
.muted{color:var(--muted);font-size:12px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat-box{background:#0b1320;border-radius:8px;padding:10px;font-size:11px;border:1px solid #1a2a44}
.stat-box strong{display:block;font-size:18px;margin-top:3px;color:var(--primary)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.player-item{background:#0e1726;border:1px solid #20324d;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.player-info{min-width:0;flex:1}
.player-info strong{display:block;font-size:13px}
.player-info small{color:var(--muted);display:block;margin-top:2px;font-size:11px}
.player-actions{display:flex;gap:4px;flex-wrap:wrap}
input,select{background:#0b1320;color:white;border:1px solid #334868;border-radius:6px;padding:8px;width:100%;font-size:13px}
label{display:block;margin:8px 0}
label span{display:block;font-size:12px;margin-bottom:4px;color:var(--muted)}
.notice{background:#1a2b45;border-left:3px solid var(--primary);border-radius:4px;padding:8px;font-size:12px;margin:8px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 5px;border-bottom:1px solid #20324d;text-align:center;white-space:nowrap}
th{background:#0e1726;color:var(--muted)}
.highlight{background:#2a2512}
.pill{display:inline-block;border-radius:10px;background:#20324d;padding:2px 6px;font-size:10px;color:var(--muted)}
.pill.gold{background:#3d2e0e;color:var(--primary);border:1px solid var(--primary)}
.pill.danger{background:#3d1313;color:var(--danger);border:1px solid var(--danger)}
.scoreboard{background:#09101d;border:1px solid var(--card-border);border-radius:10px;padding:14px;text-align:center}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:14px 0}
.team-score{font-size:36px;font-weight:900;color:var(--primary)}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:450px;margin:10px auto}
.periods div{padding:6px 2px;background:#131f33;border-radius:4px;font-size:11px}
.logline{border-bottom:1px solid #1a2a44;padding:6px 0;font-size:12px}
.news-box{background:#0e1726;border:1px solid #20324d;border-radius:8px;padding:10px;margin-bottom:8px}
.news-box small{color:var(--muted)}
footer{color:var(--muted);text-align:center;padding:15px;font-size:11px}
@media(min-width:650px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

function makeTeams(){
return TEAM_NAMES.map(name=>({
name,
division:EAST.includes(name)?"東地区":"西地区",
wins:0,losses:0,played:0,pf:0,pa:0
}));
}

function makeSchedule(){
const games=[];
for(let r=0;r<30;r++){
const rotation=TEAM_NAMES.map((_,i)=>TEAM_NAMES[(i+r)%26]);
for(let i=0;i<13;i++){
let home=rotation[i],away=rotation[25-i];
if((r+i)%2){const t=home;home=away;away=t;}
games.push({home,away,done:false,round:r+1});
}
}
const first=games.map(g=>({
home:g.away,away:g.home,done:false,round:g.round+30
}));
return [...games,...first].map((g,i)=>({...g,id:i+1}));
}

function validGame(g){
return !!g && Array.isArray(g.roster) && Array.isArray(g.market) && Array.isArray(g.teams) && typeof g.cash==="number";
}

function saveGame(){
try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));return true;}
catch(e){console.error(e);return false;}
}

function loadGame(){
try{
let raw=localStorage.getItem(SAVE_KEY);
if(!raw)return false;
let x=JSON.parse(raw);
if(!validGame(x))return false;
G=x;
return true;
}catch(e){console.error(e);return false;}
}

function log(s){
if(!G || !Array.isArray(G.log)) return;
G.log.unshift(new Date().toLocaleTimeString("ja-JP",{hour:"numeric",minute:"numeric"})+" "+s);
G.log=G.log.slice(0,50);
}

function capCalculatedSalary(){
if(!G || !Array.isArray(G.roster)) return 0;
return G.roster.reduce((sum,p)=>{
let sal=Number(p.salary)||0;
return sum + (sal > 15000 ? 15000 : sal);
},0);
}
function rawSalaryTotal(){ 
if(!G || !Array.isArray(G.roster)) return 0;
return G.roster.reduce((s,p)=>s+(Number(p.salary)||0),0); 
}
function foreignCount(){return G && Array.isArray(G.roster) ? G.roster.filter(p=>p.type==="外国籍").length : 0;}
function specialCount(){return G && Array.isArray(G.roster) ? G.roster.filter(p=>["アジア特別枠","帰化"].includes(p.type)).length : 0;}
function cap(){return{salary:capCalculatedSalary(),rawSalary:rawSalaryTotal(),cap:80000,floor:50000};}

}

<button class="primary" data-act="simulatecs" style="width:100%;margin-top:10px;padding:12px">CSの試合を進める</button>
${G.csResult?`<div style="margin-top:12px">${resultHTML(G.csResult)}</div>`:""}
</section>`;
}

const remaining=(G.schedule||[]).filter(g=>!g.done);
const nextRound=remaining.length>0?remaining[0].round:null;
const nextGames=nextRound?G.schedule.filter(g=>g.round===nextRound):[];

return `<section class="card">
<h2><span>日程・試合進行</span> <span class="pill">消化: ${(G.schedule||[]).filter(g=>g.done).length}/${(G.schedule||[]).length}</span></h2>
<div style="margin-bottom:12px">
${nextRound?btn(`第 ${nextRound} 節の全試合を実行`,"nextgame","","primary"):btn("ポストシーズンへ進む","startcs","","primary")}
</div>
<h3>${nextRound?`第 ${nextRound} 節 対戦カード`:"レギュラーシーズン終了"}</h3>
${nextGames.map(g=>`<div class="logline">${esc(g.home)} vs ${esc(g.away)} ${g.home===G.club||g.away===G.club?"<span class='pill gold'>自チーム</span>":""}</div>`).join("")}
</section>
${G.lastResult?`<section class="card"><h2>直近試合結果</h2>${resultHTML(G.lastResult)}</section>`:""}`;
}

function resultHTML(r){
return `<div class="scoreboard">
<div style="font-size:10px;color:var(--muted);letter-spacing:1px">B.PREMIER OFFICIAL RESULT</div>
<div class="scoreline">
<div><div style="font-size:12px">${esc(r.home)}</div><div class="team-score">${r.hs}</div></div>
<div style="font-weight:bold;color:var(--muted)">VS</div>
<div><div style="font-size:12px">${esc(r.away)}</div><div class="team-score">${r.as}</div></div>
</div>
<div class="periods">${r.periods.map((p,i)=>`<div><b>${i+1}Q</b><br>${p[0]}-${p[1]}</div>`).join("")}
<div><b>TOTAL</b><br><b>${r.hs}-${r.as}</b></div></div>
<p style="margin:8px 0 0;font-size:11px;color:var(--muted)">会場: ${esc(r.venue)} / 観客数: ${Number(r.attendance).toLocaleString()}人</p>
</div>`;
}

function settingsPage(){
renderTopBar();
return `<section class="card">
<h2><span>ゲーム設定・クラブ変更</span></h2>
<label><span>操作クラブ選択</span><select id="clubSelect">
${G.teams.map(t=>`<option value="${esc(t.name)}" ${G.club===t.name?"selected":""}>${esc(t.name)}（${t.division}）</option>`).join("")}
</select></label>
<button data-act="changeclub" class="primary" style="width:100%;margin-top:6px">操作クラブを変更する</button>
<div style="margin-top:16px;border-top:1px solid #20324d;padding-top:12px">
<button data-act="newgame" class="danger" style="width:100%">初期データから新しくやり直す (リセット)</button>
</div>
</section>`;
}

function newGameScreen(){
return `<section class="card" style="margin-top:20px">
<h2><span>B.PREMIER GM 起動</span></h2>
<p class="muted">お好きなクラブを選択してゼネラルマネージャーに就任してください。</p>
<label><span>担当クラブ</span><select id="firstClub">
${TEAM_NAMES.map(n=>`<option value="${esc(n)}" ${n==="信州ブレイブウォリアーズ"?"selected":""}>${esc(n)}</option>`).join("")}
</select></label>
<button data-act="firstgame" class="primary" style="width:100%;margin-top:10px;padding:12px">GM就任してゲーム開始</button>
</section>`;
}

function render(){
try {
  if(!validGame(G)){$("app").innerHTML=newGameScreen();return;}
  const pages={home:homePage,standings:standingsPage,team:teamPage,news:newsPage,market:marketPage,finance:financePage,season:schedulePage,settings:settingsPage};
  $("app").innerHTML=(pages[PAGE]||homePage)();
} catch(e) {
  console.error(e);
  $("app").innerHTML=`<div class="card" style="border-color:var(--danger)"><h2>エラーが発生しました</h2><p class="muted">${esc(e.message)}</p><button class="danger" data-act="newgame" style="width:100%;margin-top:10px">データをリセットしてやり直す</button></div>`;
}
}

function calculateTeamPower(isMyTeam){
if(!isMyTeam) return 76 + Math.random()*5;
const activeRoster = G.roster.filter(p=>p.injury<=0);
const sorted = [...activeRoster].sort((a,b)=>b.rating-a.rating);
const top5 = sorted.slice(0,5);
const base = top5.reduce((s,p)=>s+p.rating,0) / Math.max(1, top5.length);
const cBonus = G.coaches.reduce((s,c)=>s+(c.rating-70)*.1, 0);
return base + cBonus;
}

function simulateGame(){
const remaining=G.schedule.filter(x=>!x.done);
if(remaining.length===0){alert("全日程が終了しています。ポストシーズンへ進んでください。");return;}
const currentRound=remaining[0].round;
const roundGames=G.schedule.filter(g=>g.round===currentRound);

G.roster.forEach(p=>{if(p.injury>0)p.injury--;});

roundGames.forEach(g=>{
let isHome=g.home===G.club;
let isAway=g.away===G.club;

let hPow=calculateTeamPower(isHome);
let aPow=calculateTeamPower(isAway);

let hs=0,as=0,periods=[];
for(let q=0;q<4;q++){
let h=Math.max(14,Math.round(21+Math.random()*8+(hPow-75)*.25));
let a=Math.max(14,Math.round(20+Math.random()*8+(aPow-75)*.25));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){as+=1;periods[3][1]++;}
g.done=true;g.result={hs,as};

for(const [name,score,against] of [[g.home,hs,as],[g.away,as,hs]]){
const t=G.teams.find(x=>x.name===name);
if(t){
t.played++;t.pf+=score;t.pa+=against;
if(score>against)t.wins++;else t.losses++;
}
}

if(isHome||isAway){
const attendance=Math.round(G.attendance*(.85+Math.random()*.3));
const revenue=isHome?Math.round(attendance*G.ticket/10000):0;
const expenses=Math.round(2200+rawSalaryTotal()/60+G.coaches.reduce((s,c)=>s+c.salary,0)/100);
const profit=revenue-expenses;
G.cash+=profit;
let isWin = hs > as;
G.fans=Math.round(G.fans+(isWin?1200:-800));
G.fanSatisfy=Math.min(100,Math.max(20,G.fanSatisfy+(isWin?1:-2)));

G.lastResult={home:g.home,away:g.away,hs,as,periods,venue:isHome?"ホームアリーナ":"アウェイ",attendance};
log(`第${currentRound}節: ${g.home} ${hs}-${as} ${g.away} (収支: ${profit>=0?"+":""}${yen(profit)})`);

if(Math.random()<0.15 && G.roster.length>0){
  const victim = G.roster[Math.floor(Math.random()*G.roster.length)];
  if(victim.injury<=0){
    victim.injury=Math.floor(Math.random()*3)+2;
    G.news.unshift({title:`【速報】${victim.name}が負傷離脱`,date:`第${currentRound}節`,body:`練習・試合中に負傷し、全治約${victim.injury}試合の見込み。チームへの影響が懸念される。`});
    log(`⚠️ ${victim.name}が負傷離脱しました（全治${victim.injury}節）`);
  }
}

if(Math.random()<0.2 && !G.pendingMeeting){
  const targets=["直近のローテーション起用について、控え選手にもチャンスを与えるべきではないか？","外国籍選手のコンディション維持について、練習量を調整すべきか？","次戦に向けたディフェンス戦術の変更について相談があります。"];
  G.pendingMeeting={text:targets[Math.floor(Math.random()*targets.length)]};
}
}
});

saveGame();render();
}

function startCS(){
G.phase="cs";
G.csStage="quarter";
log("チャンピオンシップ（ポストシーズン）が開幕しました！");
saveGame();render();
}

function simulateCS(){
let hPow=calculateTeamPower(true);
let aPow=78 + Math.random()*5;

let hs=0,as=0,periods=[];
for(let q=0;q<4;q++){
let h=Math.max(15,Math.round(22+Math.random()*8+(hPow-75)*.25));
let a=Math.max(15,Math.round(21+Math.random()*8+(aPow-75)*.25));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){as+=1;periods[3][1]++;}

let isWin = hs > as;
G.csResult={home:G.club,away:"ライバルクラブ",hs,as,periods,venue:"CS特設アリーナ",attendance:8000};

if(isWin){
if(G.csStage==="quarter"){
  G.csStage="semi";
  log("チャンピオンシップ 準々決勝を突破しました！次は準決勝です。");
}else if(G.csStage==="semi"){
  G.csStage="finals";
  log("チャンピオンシップ 準決勝を突破しました！いよいよファイナルです！");
}else{
  log("🏆 おめでとうございます！B.PREMIERの年間王者に輝きました！");
  G.news.unshift({title:`🏆 ${G.club}がB.PREMIER年間王者に輝く！`,date:"CS決勝",body:"激闘のチャンピオンシップを制し、栄光の頂点に立った。"});
  alert("🏆 チャンピオンシップ優勝おめでとうございます！");
  G.phase="off";
}
}else{
log("チャンピオンシップ敗退となりました。オフシーズンへ移行します。");
alert("チャンピオンシップ敗退…お疲れ様でした。オフシーズンへ移行します。");
G.phase="off";
}
saveGame();render();
}

function processNextSeason(){
if(!confirm("シーズンを終了して次の年度へ移行しますか？"))return;
G.roster.forEach(p=>p.years--);
const expired=G.roster.filter(p=>p.years<=0);
G.roster=G.roster.filter(p=>p.years>0);
expired.forEach(p=>{p.years=1;G.market.push(p);});

const startYear=parseInt(G.seasonStart)+1;
G.seasonStart=startYear;
G.season=`${startYear}-${String(startYear+1).slice(2)}`;
G.teams=makeTeams();
G.schedule=makeSchedule();
G.phase="regular";
G.csStage=null;
G.csResult=null;
G.lastResult=null;
log(`新シーズン (${G.season}) が開幕しました。`);
saveGame();render();
}

function act(action,id){
if(action==="firstgame"){
const selectedClub = $("firstClub")?.value || "信州ブレイブウォリアーズ";
createNewGame(selectedClub);
render();return;
}
if(action==="newgame"){
if(!confirm("初期データに戻してやり直しますか？"))return;
G=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}
PAGE="home";render();return;
}
if(!validGame(G)){alert("ゲームを開始してください。");render();return;}
if(action==="save"){alert(saveGame()?"データをセーブしました。":"セーブ失敗");return;}
if(action==="gopage"){PAGE=id;render();return;}
if(action==="st-east"){window.standingsTab="EAST";render();return;}
if(action==="st-west"){window.standingsTab="WEST";render();return;}
if(action==="resolgemeeting"){
if(id==="accept"){
  G.fanSatisfy=Math.min(100,G.fanSatisfy+3);
  log("首脳陣の意見を取り入れました（ファン満足度UP）");
}else{
  log("首脳陣の提案を見送りました");
}
G.pendingMeeting=null;
saveGame();render();return;
}
if(action==="changeclub"){
const name=$("clubSelect")?.value;
if(!name)return;
G.club=name;
if(REAL_ROSTERS[name]) {
  G.roster = JSON.parse(JSON.stringify(REAL_ROSTERS[name]));
}
log("操作クラブを"+name+"に変更（ロスター更新）");
saveGame();render();
alert("操作クラブを変更しました。ロスターも更新されました。");return;
}
if(action==="extend"){
const p=G.roster.find(x=>x.id===id);
if(!p)return;
const n=Number(prompt(`${p.name}の契約延長年数（1〜3年）`,"1"));
if(!Number.isInteger(n)||n<1||n>3)return;
p.years+=n;log(`${p.name}と契約を${n}年延長`);saveGame();render();return;
}
if(action==="release"){
const i=G.roster.findIndex(p=>p.id===id);
if(i<0)return;
const p=G.roster[i];
if(!confirm(`${p.name}を自由契約（解雇）にしますか？`))return;
G.roster.splice(i,1);G.market.push(p);
log(`${p.name}を戦力外通告`);saveGame();render();return;
}
if(action==="sign"){
const i=G.market.findIndex(p=>p.id===id);
if(i<0)return;
const p=G.market[i];
if(G.roster.length>=14)return alert("ロスター上限（14名）に達しています。");
if(p.type==="外国籍"&&foreignCount()>=3)return alert("外国籍枠は最大3名です。");
if(["帰化","アジア特別枠"].includes(p.type)&&specialCount()>=1)return alert("帰化・アジア特別枠は最大1名です。");

const nextCap = capCalculatedSalary() + (p.salary > 15000 ? 15000 : p.salary);
if(nextCap > 80000)return alert("サラリーキャップ（8億円）を超過します。");

const fee=Math.round(p.salary*.1);
if(G.cash<p.salary+fee)return alert("資金が不足しています。");
if(!confirm(`${p.name}と契約交渉しますか？\n年俸: ${yen(p.salary)}\n契約金: ${yen(fee)}`))return;
G.cash-=(p.salary+fee);G.roster.push(p);G.market.splice(i,1);
log(`${p.name}と契約合意しました。`);saveGame();render();return;
}
if(action==="hirecoach"){
const i=G.coachMarket.findIndex(c=>c.id===id);
if(i<0)return;
const c=G.coachMarket[i];
if(G.coaches.some(x=>x.role===c.role))return alert(`すでに${c.role}が契約中です。`);
if(G.cash<c.salary)return alert("資金不足です。");
G.cash-=c.salary;G.coaches.push(c);G.coachMarket.splice(i,1);
log(`${c.name}コーチと契約`);saveGame();render();return;
}
if(action==="firecoach"){
const i=G.coaches.findIndex(c=>c.id===id);
if(i<0)return;
const c=G.coaches[i];
G.coaches.splice(i,1);G.coachMarket.push(c);
log(`${c.name}コーチを解任`);saveGame();render();return;
}
if(action==="savefinance"){
const t=Number($("ticketInput")?.value),a=Number($("attendanceInput")?.value);
if(!Number.isFinite(t)||t<500||t>30000||!Number.isFinite(a)||a<0||a>20000)return alert("入力値が不正です。");
G.ticket=Math.round(t);G.attendance=Math.round(a);
log("経営方針を更新しました。");saveGame();render();return;
}
if(action==="nextgame"){simulateGame();return;}
if(action==="startcs"){startCS();return;}
if(action==="simulatecs"){simulateCS();return;}
if(action==="nextseason"){processNextSeason();return;}
}

document.addEventListener("click",e=>{
const b=e.target.closest("button");
if(!b)return;
if(b.dataset.page){PAGE=b.dataset.page;render();return;}
if(b.dataset.act){
try{act(b.dataset.act,b.dataset.id||"");}
catch(err){console.error(err);alert("エラー: "+err.message);}
}
});

if(!loadGame())G=null;
render();
</script>
</body>
