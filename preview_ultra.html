
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.LEAGUE GM ULTRA</title>
<style>
:root{--bg:#101827;--panel:#1a2940;--line:#344761;--gold:#e0ad43;--muted:#afbed3;--red:#a73c4b;--green:#27856a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f3f6fc;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:16px;background:#18263c;border-bottom:2px solid var(--gold)}
h1{font-size:22px;margin:0}
header p{margin:5px 0 0;color:var(--muted);font-size:12px}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#111c2d;position:sticky;top:0;z-index:5}
button{border:0;border-radius:8px;padding:10px 12px;background:#30445f;color:white;font-weight:700;cursor:pointer}
button.primary{background:var(--gold);color:#171717}
button.danger{background:var(--red)}
button.good{background:var(--green)}
button:disabled{opacity:.4}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:13px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:12px 0 7px}
.muted,small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:#111c2d;padding:12px;border-radius:9px;font-size:12px}
.stat strong{display:block;font-size:20px;margin-top:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;margin:9px 0}
label span{display:block;font-size:13px;margin-bottom:5px;color:#c5d1e2}
input,select{max-width:100%;padding:9px;background:#101827;color:white;border:1px solid #50627b;border-radius:7px}
.player{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}
.player-info{flex:1;min-width:0}
.player-info strong{display:block}
.player-info small{display:block;margin-top:4px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.notice{background:#243b51;border-radius:8px;padding:10px;font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:#111c2d}
.highlight{background:#3b3524}
.pill{display:inline-block;border-radius:20px;background:#344761;padding:3px 8px;font-size:11px}
.scoreboard{max-width:760px;margin:auto;background:#292929;border-radius:14px;padding:22px 16px;text-align:center}
.scoreboard .league{color:#aaa;letter-spacing:2px;font-weight:800}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:25px 0}
.team-score{font-size:52px;font-weight:900}
.home-score{color:#ffda7a}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:440px;margin:15px auto}
.periods div{padding:8px 2px;background:#1e1e1e;border-radius:5px}
.game-meta{color:#bbb;line-height:1.9;margin-top:25px}
.logline{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
.empty{padding:20px;color:var(--muted);text-align:center}
@media(min-width:650px){
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.scoreline{gap:30px}
}
</style>
</head>
<body>
<header>
<h1>🏀 B.LEAGUE GM ULTRA</h1>
<p>クラブ経営・ロスター・試合・順位表シミュレーション（ゲーム内データ）</p>
</header>
<nav>
<button data-page="home">ホーム</button>
<button data-page="standings">順位表</button>
<button data-page="roster">選手・契約</button>
<button data-page="market">選手市場</button>
<button data-page="coaches">コーチ</button>
<button data-page="finance">経営・財務</button>
<button data-page="schedule">日程・試合</button>
<button data-page="settings">設定</button>
</nav>
<main id="app"></main>
<script>
"use strict";

const KEY="bleague_gm_ultra_v9";
const $=id=>document.getElementById(id);
let G=null,PAGE="home";

const TEAM_NAMES=[
"北海道","仙台","秋田","茨城","宇都宮","群馬","越谷",
"A東京","SR渋谷","川崎","横浜BC","三遠","三河","名古屋D",
"滋賀","京都","大阪","島根","広島","佐賀","長崎","琉球",
"信州","富山","福井","千葉J"
];

function uid(){
return "x"+Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function player(name,pos,rating,salary,type="日本人",years=1){
return {id:uid(),name,pos,rating,salary,type,years};
}

function teams(){
return TEAM_NAMES.map((name,i)=>({
name,wins:0,losses:0,ptsFor:0,ptsAgainst:0,played:0,
home:i===22?"信州ブレイブウォリアーズ":name,
full:i===22?"信州ブレイブウォリアーズ":name+"クラブ"
}));
}

function newGame(club="信州ブレイブウォリアーズ"){
const market=[
player("Marcus Reid","PF",87,12000,"外国籍",1),
player("Jaylen Carter","SG/SF",87,8500,"外国籍",1),
player("Eric Johnson","C",83,6000,"外国籍",1),
player("朝倉 蒼真","PG",84,6500,"日本人",2),
player("神谷 蓮","SF",86,9000,"日本人",2),
player("森下 悠真","SG/SF",82,4500,"日本人",2),
player("李 明","SF",79,4000,"アジア特別枠",2),
player("David Brown","C",85,8000,"外国籍",1),
player("渡辺 陽","PG",80,5000,"日本人",2),
player("帰化選手サンプル","PF/C",81,5500,"帰化",2)
];

const roster=[
player("田中 大地","PG",76,3500,"日本人",2),
player("佐藤 悠斗","SG",75,3200,"日本人",2),
player("高橋 陸","SF",77,4000,"日本人",2),
player("山本 健","PF",76,3800,"日本人",2),
player("鈴木 海斗","C",78,4500,"日本人",2),
player("渡辺 翔","PG",73,2500,"日本人",1),
player("伊藤 蓮","SG",74,2800,"日本人",1),
player("小林 蒼","SF",72,2200,"日本人",2),
player("加藤 颯","PF",73,2600,"日本人",1),
player("吉田 誠","C",72,2400,"日本人",1)
];

const coachMarket=[
{id:uid(),name:"佐々木 健",role:"HC",rating:78,salary:7000},
{id:uid(),name:"Michael Green",role:"HC",rating:84,salary:12000},
{id:uid(),name:"田村 誠",role:"OF",rating:75,salary:3000},
{id:uid(),name:"James Wilson",role:"DF",rating:80,salary:4500},
{id:uid(),name:"小林 修",role:"育成",rating:77,salary:2500}
];

G={
club,season:2026,cash:300000,ticket:2500,attendance:3500,
roster,market,teams:teams(),games:[],gameIndex:0,
coaches:[{id:uid(),name:"初期ヘッドコーチ",role:"HC",rating:70,salary:3000}],
coachMarket,log:["新しいゲームを開始しました。"],lastResult:null
};
makeSchedule();
save();
PAGE="home";
}

function makeSchedule(){
G.games=[];
let list=G.teams.map(t=>t.name);
let rounds=[];
for(let r=0;r<30;r++){
let round=[];
for(let i=0;i<13;i++){
let a=list[i],b=list[25-i];
if((r+i)%2===0)[a,b]=[b,a];
round.push({home:a,away:b,done:false,result:null});
}
rounds.push(round);
list=[list[0],list[25],...list.slice(1,25)];
}
G.games=rounds.flat().slice(0,390);
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(G));
return true;
}catch(e){
console.error(e);
return false;
}
}

function load(){
try{
let x=JSON.parse(localStorage.getItem(KEY));
if(x&&Array.isArray(x.roster)&&Array.isArray(x.teams)&&Array.isArray(x.market)){
G=x;
return true;
}
}catch(e){}
return false;
}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function money(n){
return Math.round(n).toLocaleString("ja-JP")+"万円";
}

function salary(){
return G.roster.reduce((s,p)=>s+p.salary,0);
}

function foreign(){
return G.roster.filter(p=>p.type==="外国籍").length;
}

function special(){
return G.roster.filter(p=>["アジア特別枠","帰化"].includes(p.type)).length;
}

function capStatus(){
let s=salary();
return {salary:s,cap:80000,floor:50000,over:s>80000,under:s<50000};
}

function log(s){
G.log.unshift(new Date().toLocaleString("ja-JP")+" "+s);
G.log=G.log.slice(0,80);
}

function btn(label,act,id="",cls=""){
return `<button class="${cls}" data-act="${act}" data-id="${esc(id)}">${label}</button>`;
}

function pageHome(){
let c=capStatus();
return `<section class="card">
<h2>${esc(G.club)} <span class="pill">${G.season}-${String((G.season+1)%100).padStart(2,"0")}</span></h2>
<div class="stats">
<div class="stat">手元資金<strong>${money(G.cash)}</strong></div>
<div class="stat">選手年俸<strong>${money(c.salary)}</strong></div>
<div class="stat">サラリーキャップ<strong>${money(c.cap)}</strong></div>
<div class="stat">サラリーフロア<strong>${money(c.floor)}</strong></div>
</div>
<p>成績：${teamRecord(G.club)} / 登録選手：${G.roster.length}人 / コーチ：${G.coaches.length}人</p>
<div class="notice">${c.over?"⚠ サラリーキャップ超過です。":c.under?"⚠ サラリーフロア未達です。":"サラリーキャップ・フロアの範囲内です。"} ゲーム内の仮設定値です。</div>
</section>
<section class="card"><h2>最近の記録</h2>
${G.log.slice(0,8).map(x=>`<div class="logline">${esc(x)}</div>`).join("")}
</section>`;
}

function teamRecord(name){
let t=G.teams.find(x=>x.name===name||x.full===name);
return t?`${t.wins}勝 ${t.losses}敗`:"0勝 0敗";
}

function pageStandings(){
let arr=[...G.teams].sort((a,b)=>b.wins-a.wins||(b.ptsFor-b.ptsAgainst)-(a.ptsFor-a.ptsAgainst));
return `<section class="card"><h2>順位表</h2>
<p class="muted">順位はこのゲーム内で行った試合の結果に基づきます。未消化の試合は反映されません。</p>
<div class="tablewrap"><table><thead><tr><th>順位</th><th>チーム</th><th>試合</th><th>勝</th><th>敗</th><th>勝率</th><th>得失点差</th></tr></thead>
<tbody>${arr.map((t,i)=>`<tr class="${t.name===G.club||t.full===G.club?"highlight":""}">
<td>${i+1}</td><td>${esc(t.full)}</td><td>${t.played}</td><td>${t.wins}</td><td>${t.losses}</td>
<td>${t.played?(t.wins/t.played).toFixed(3):".000"}</td><td>${t.ptsFor-t.ptsAgainst}</td></tr>`).join("")}</tbody></table></div>
</section>`;
}

function pageRoster(){
let c=capStatus();
return `<section class="card"><h2>選手・契約</h2>
<p>登録：${G.roster.length}/14 外国籍：${foreign()}/3 帰化・アジア特別枠：${special()}/1</p>
<p>年俸合計：${money(c.salary)} / キャップ：${money(c.cap)} / フロア：${money(c.floor)}</p>
${G.roster.map(p=>`<div class="player"><div class="player-info">
<strong>${esc(p.name)}（${esc(p.pos)}）</strong>
<small>能力 ${p.rating} / 年俸 ${money(p.salary)} / 契約 ${p.years}年 / ${esc(p.type)}</small>
</div><div class="actions">${btn("契約延長","extend",p.id)}${btn("契約解除","release",p.id,"danger")}</div></div>`).join("")}
</section>`;
}

function pageMarket(){
return `<section class="card"><h2>選手市場</h2>
<p>獲得前に年俸・枠・資金を確認します。年俸上限：${money(80000)}</p>
${G.market.map(p=>`<div class="player"><div class="player-info">
<strong>${esc(p.name)}（${esc(p.pos)}）</strong>
<small>能力 ${p.rating} / 年俸 ${money(p.salary)} / ${p.years}年 / ${esc(p.type)}</small>
</div>${btn("契約","sign",p.id,"primary")}</div>`).join("")||'<p class="empty">市場に選手はいません。</p>'}
</section>`;
}

function pageCoaches(){
return `<section class="card"><h2>契約中のコーチ</h2>
${G.coaches.map(p=>`<div class="player"><div class="player-info">
<strong>${esc(p.name)}（${esc(p.role)}）</strong><small>能力 ${p.rating} / 年俸 ${money(p.salary)}</small>
</div>${btn("契約解除","firecoach",p.id,"danger")}</div>`).join("")||'<p>契約中のコーチはいません。</p>'}
</section>
<section class="card"><h2>コーチ市場</h2>
${G.coachMarket.map(p=>`<div class="player"><div class="player-info">
<strong>${esc(p.name)}（${esc(p.role)}）</strong><small>能力 ${p.rating} / 年俸 ${money(p.salary)}</small>
</div>${btn("契約する","hirecoach",p.id,"primary")}</div>`).join("")||'<p>市場にコーチはいません。</p>'}
</section>`;
}

function pageFinance(){
let c=capStatus();
return `<section class="card"><h2>経営・サラリー管理</h2>
<div class="stats">
<div class="stat">手元資金<strong>${money(G.cash)}</strong></div>
<div class="stat">選手年俸<strong>${money(c.salary)}</strong></div>
<div class="stat">キャップ<strong>${money(c.cap)}</strong></div>
<div class="stat">フロア<strong>${money(c.floor)}</strong></div>
</div>
<p>${c.over?"キャップ超過":c.under?"フロア未達":"キャップ・フロア範囲内"}</p>
<label><span>チケット価格（円）</span><input id="ticket" type="number" min="500" max="20000" step="100" value="${G.ticket}"></label>
<label><span>平均観客数</span><input id="attendance" type="number" min="0" max="20000" step="100" value="${G.attendance}"></label>
<button data-act="savefinance" class="primary">設定を保存</button>
<p class="muted">キャップ8億円・フロア5億円はこのゲーム用の設定であり、公式規定を保証するものではありません。</p>
</section>`;
}

function pageSchedule(){
let upcoming=G.games.filter(g=>!g.done).slice(0,15);
return `<section class="card"><h2>日程・試合</h2>
<p>シミュレーション済み試合：${G.games.filter(g=>g.done).length} / ${G.games.length}</p>
<p class="muted">試合結果は架空のゲーム内結果です。</p>
<button class="primary" data-act="nextgame" ${upcoming.length?"":"disabled"}>次の試合を実行</button>
<h3>直近の日程</h3>
${upcoming.map(g=>`<div class="logline">${esc(g.home)} vs ${esc(g.away)}</div>`).join("")||'<p>すべての登録日程が終了しました。</p>'}
<h3>最新リザルト</h3>${G.lastResult?resultHTML(G.lastResult):'<p class="empty">まだ試合結果がありません。</p>'}
</section>`;
}

function resultHTML(r){
return `<div class="scoreboard">
<div class="league">B.LEAGUE 2026-27 B.PREMIER</div>
<div style="margin:18px">FINAL</div>
<div class="scoreline">
<div><div>${esc(r.home)}</div><div class="team-score home-score">${r.hs}</div><span class="pill">HOME</span></div>
<div>—</div>
<div><div>${esc(r.away)}</div><div class="team-score">${r.as}</div><span class="pill">AWAY</span></div>
</div>
<div class="periods">${r.periods.map((p,i)=>`<div><small>${i+1}Q</small><br>${p[0]} - ${p[1]}</div>`).join("")}
<div><small>FINAL</small><br><b>${r.hs}-${r.as}</b></div></div>
<div class="game-meta">会場：${esc(r.venue)}<br>観客数：${r.attendance.toLocaleString()}人<br>試合結果はゲーム内シミュレーションです。</div>
</div>`;
}

function pageSettings(){
return `<section class="card"><h2>ゲーム設定</h2>
<label><span>操作するチーム</span>
<select id="clubSelect">${G.teams.map(t=>`<option value="${esc(t.name)}" ${G.club===t.name||G.club===t.full?"selected":""}>${esc(t.full)}</option>`).join("")}</select>
</label>
<button data-act="changeclub" class="primary">操作チームを変更</button>
<hr><div class="row">${btn("セーブ","save","",'good')}${btn("新規ゲーム","newgame","",'danger')}</div>
<p class="muted">新規ゲームは現在のセーブデータを置き換えます。</p>
</section>`;
}

function render(){
if(!G){
$("app").innerHTML=`<section class="card"><h2>新規ゲーム</h2>
<p>操作するチームを選択してゲームを開始してください。</p>
<label><span>チーム</span><select id="firstClub">${TEAM_NAMES.map(n=>`<option value="${esc(n)}" ${n==="信州"?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
<button data-act="firstgame" class="primary">ゲーム開始</button></section>`;
return;
}
let pages={home:pageHome,standings:pageStandings,roster:pageRoster,market:pageMarket,coaches:pageCoaches,finance:pageFinance,schedule:pageSchedule,settings:pageSettings};
$("app").innerHTML=(pages[PAGE]||pageHome)();
}

function teamForGame(short){
return short==="信州"?"信州ブレイブウォリアーズ":short+"クラブ";
}

function simulateGame(){
let g=G.games.find(x=>!x.done);
if(!g){alert("未消化の試合がありません。");return;}
let homeTeam=teamForGame(g.home),awayTeam=teamForGame(g.away);
let hp=G.roster.reduce((s,p)=>s+p.rating,0)/Math.max(1,G.roster.length);
let hBase=75+Math.random()*20+(homeTeam===G.club?hp-75:0);
let aBase=72+Math.random()*22+(awayTeam===G.club?hp-75:0);
let periods=[],hs=0,as=0;
for(let i=0;i<4;i++){
let h=Math.max(10,Math.round(hBase/4+(Math.random()*12-6)));
let a=Math.max(10,Math.round(aBase/4+(Math.random()*12-6)));
periods.push([h,a]);hs+=h;as+=a;
}
if(hs===as){hs+=2;as+=1;}
g.done=true;g.result={hs,as};
let home=G.teams.find(t=>t.name===g.home),away=G.teams.find(t=>t.name===g.away);
if(home&&away){
home.played++;away.played++;home.ptsFor+=hs;home.ptsAgainst+=as;away.ptsFor+=as;away.ptsAgainst+=hs;
if(hs>as){home.wins++;away.losses++;}else{away.wins++;home.losses++;}
}
let att=Math.round(G.attendance*(0.8+Math.random()*0.4));
let rev=Math.round(att*G.ticket/10000);
let costs=Math.round(1200+salary()/80+G.coaches.reduce((s,c)=>s+c.salary,0)/80);
let profit=rev-costs;G.cash+=profit;
G.lastResult={home:homeTeam,away:awayTeam,hs,as,periods,venue:"ホームアリーナ",attendance:att};
log(`${homeTeam} ${hs}-${as} ${awayTeam} / 収支 ${profit>=0?"+":""}${money(profit)}`);
save();render();
}

function action(a,id){
if(a==="firstgame"){
let v=$("firstClub")?.value||"信州";
newGame(teamForGame(v));render();return;
}
if(a==="newgame"){
if(!confirm("新規ゲームを開始しますか？現在のデータは上書きされます。"))return;
G=null;
try{localStorage.removeItem(KEY);}catch(e){}
PAGE="home";render();return;
}
if(!G)return;
if(a==="save"){alert(save()?"セーブしました。":"保存に失敗しました。");return;}
if(a==="changeclub"){
let v=$("clubSelect")?.value;if(!v)return;
G.club=teamForGame(v);log("操作チームを"+G.club+"に変更");
save();render();alert("操作チームを変更しました。");return;
}
if(a==="extend"){
let p=G.roster.find(x=>x.id===id);if(!p)return alert("選手が見つかりません");
let n=Number(prompt(`${p.name}選手の延長年数（1～3年）`,"1"));
if(!Number.isInteger(n)||n<1||n>3)return;
if(!confirm(`${p.name}選手の契約を${n}年延長しますか？`))return;
p.years+=n;log(`${p.name}選手と${n}年延長`);save();render();alert("契約延長しました。");return;
}
if(a==="release"){
let i=G.roster.findIndex(x=>x.id===id);if(i<0)return alert("選手が見つかりません");
let p=G.roster[i];if(!confirm(`${p.name}選手を契約解除しますか？`))return;
G.roster.splice(i,1);G.market.push(p);log(`${p.name}選手を契約解除`);save();render();alert("契約解除しました。");return;
}
if(a==="sign"){
let i=G.market.findIndex(x=>x.id===id);if(i<0)return alert("選手が見つかりません");
let p=G.market[i];
if(G.roster.length>=14)return alert("登録上限14人です");
if(p.type==="外国籍"&&foreign()>=3)return alert("外国籍枠は最大3人です");
if(["帰化","アジア特別枠"].includes(p.type)&&special()>=1)return alert("帰化・アジア特別枠は合計1人までです");
if(salary()+p.salary>80000)return alert("サラリーキャップ8億円を超えます");
let fee=Math.round(p.salary*.1);
if(G.cash<p.salary+fee)return alert("資金が不足しています");
if(!confirm(`${p.name}選手と契約しますか？\n年俸 ${money(p.salary)}\n契約金 ${money(fee)}`))return;
G.cash-=p.salary+fee;G.roster.push(p);G.market.splice(i,1);
log(`${p.name}選手と契約`);save();render();alert("選手と契約しました。");return;
}
if(a==="hirecoach"){
let i=G.coachMarket.findIndex(x=>x.id===id);if(i<0)return alert("コーチが見つかりません");
let p=G.coachMarket[i];
if(G.coaches.some(c=>c.role===p.role))return alert(`${p.role}はすでに契約中です。先に解除してください。`);
if(G.cash<p.salary)return alert("資金が不足しています");
if(!confirm(`${p.name}（${p.role}）と契約しますか？ 年俸 ${money(p.salary)}`))return;
G.cash-=p.salary;G.coaches.push(p);G.coachMarket.splice(i,1);
log(`${p.name}コーチと契約`);save();render();alert("コーチと契約しました。");return;
}
if(a==="firecoach"){
let i=G.coaches.findIndex(x=>x.id===id);if(i<0)return alert("コーチが見つかりません");
let p=G.coaches[i];if(!confirm(`${p.name}コーチとの契約を解除しますか？`))return;
G.coaches.splice(i,1);G.coachMarket.push(p);log(`${p.name}コーチを契約解除`);
save();render();alert("コーチを契約解除しました。");return;
}
if(a==="savefinance"){
let t=Number($("ticket")?.value),n=Number($("attendance")?.value);
if(!Number.isFinite(t)||t<500||t>20000||!Number.isFinite(n)||n<0||n>20000)return alert("入力値を確認してください");
G.ticket=Math.round(t);G.attendance=Math.round(n);save();render();alert("財務設定を保存しました。");return;
}
if(a==="nextgame"){simulateGame();return;}
}

document.addEventListener("click",e=>{
let b=e.target.closest("button");if(!b)return;
if(b.dataset.page){PAGE=b.dataset.page;render();return;}
if(b.dataset.act){
try{action(b.dataset.act,b.dataset.id||"");}
catch(err){console.error(err);alert("操作エラー："+err.message);}
}
});

if(!load())G=null;
render();
</script>
</body>
</html>
