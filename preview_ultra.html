
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B.LEAGUE GM ULTRA</title>
<style>
:root{--bg:#0b1020;--panel:#151e33;--panel2:#1d2942;--line:#30415f;--text:#f3f6ff;--muted:#aab7d0;--blue:#4c8dff;--green:#42d392;--red:#ff6d7d;--gold:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:20px 16px;background:linear-gradient(120deg,#132951,#172039);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:23px}header p{color:var(--muted);margin:7px 0 0;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:14px}
.topstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}
.stat small{color:var(--muted);display:block;font-size:11px}.stat strong{display:block;margin-top:6px;font-size:18px}
nav{display:flex;gap:7px;overflow:auto;padding:3px 0 13px}
button, input, select{font:inherit}
button{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#293753}button.danger{background:#a9354c}button.success{background:#187c5b}
nav button{white-space:nowrap;flex-shrink:0}
nav button.active{background:#fff;color:#15213a}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:14px 0 8px}
p{line-height:1.6}.muted{color:var(--muted)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}
label{font-size:12px;color:var(--muted)}
input,select{width:100%;min-width:0;background:#0d1629;border:1px solid var(--line);border-radius:8px;color:white;padding:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.player,.coach,.match,.logitem{background:var(--panel2);border-radius:9px;padding:11px;margin:7px 0}
.player .name,.coach .name{font-weight:700}
.pill{display:inline-block;border-radius:20px;padding:3px 7px;background:#34435f;font-size:11px;margin:2px}
.pill.foreign{background:#5b3b77}.pill.asia{background:#23635c}
.big{font-size:26px;font-weight:800}
.notice{padding:12px;border:1px solid var(--line);background:#101a2d;border-radius:10px;margin:10px 0}
.hidden{display:none!important}
footer{color:var(--muted);font-size:11px;padding:18px 2px}
@media(max-width:620px){.topstats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:10px}.stat strong{font-size:16px}header h1{font-size:21px}th,td{padding:8px 5px}}
</style>
</head>
<body>
<header>
  <h1>🏀 B.LEAGUE GM ULTRA</h1>
  <p>クラブ経営・選手補強・コーチ編成・チケット戦略・シーズン運営</p>
</header>
<div class="wrap">
  <div class="topstats">
    <div class="stat"><small>クラブ</small><strong id="clubStat">信州ブレイブウォリアーズ</strong></div>
    <div class="stat"><small>運営資金</small><strong id="cashStat">30.00億円</strong></div>
    <div class="stat"><small>シーズン</small><strong id="seasonStat">2026-27</strong></div>
    <div class="stat"><small>チーム戦力</small><strong id="powerStat">--</strong></div>
  </div>

  <nav id="nav">
    <button data-page="home" class="active">ホーム</button>
    <button data-page="roster">ロスター</button>
    <button data-page="market">選手市場</button>
    <button data-page="coaches">コーチ</button>
    <button data-page="tickets">チケット・収入</button>
    <button data-page="league">順位表</button>
    <button data-page="schedule">試合・シーズン</button>
    <button data-page="finance">経営・セーブ</button>
  </nav>

  <main id="content"></main>
  <footer>ゲーム内の成績・選手・契約・収支はシミュレーションです。実際のB.LEAGUE公式記録ではありません。</footer>
</div>

<script>
"use strict";

const CLUBS = [
["レバンガ北海道","東"],["仙台89ERS","東"],["秋田ノーザンハピネッツ","東"],
["茨城ロボッツ","東"],["宇都宮ブレックス","東"],["群馬クレインサンダーズ","東"],
["アルティーリ千葉","東"],["千葉ジェッツ","東"],["アルバルク東京","東"],
["サンロッカーズ渋谷","東"],["川崎ブレイブサンダース","東"],
["横浜ビー・コルセアーズ","東"],["富山グラウジーズ","東"],
["信州ブレイブウォリアーズ","西"],["三遠ネオフェニックス","西"],
["シーホース三河","西"],["名古屋ダイヤモンドドルフィンズ","西"],
["滋賀レイクス","西"],["京都ハンナリーズ","西"],["大阪エヴェッサ","西"],
["神戸ストークス","西"],["島根スサノオマジック","西"],
["広島ドラゴンフライズ","西"],["佐賀バルーナーズ","西"],
["長崎ヴェルカ","西"],["琉球ゴールデンキングス","西"]
];

const FIRST = ["田中","佐藤","鈴木","高橋","伊藤","渡辺","山本","中村","小林","加藤","吉田","山田","松本","井上","木村","林","斎藤","清水","森","池田"];
const LAST = ["翔太","大輝","健太","悠真","拓海","蓮","直樹","颯太","海斗","陸","悠斗","陽向","優斗","蒼","亮太","圭介","和真","一樹","新","晴"];

const FOREIGN_FIRST = ["Marcus","Jordan","Daniel","Eric","Jaylen","Michael","Chris","Anthony","Darius","Kevin"];
const FOREIGN_LAST = ["Reid","Carter","Brooks","Johnson","Williams","Brown","Davis","Miller","Wilson","Taylor"];

const COACH_NAMES = [
["佐々木健","HC",78,3200],["田村誠","HC",73,2400],["高橋亮","HC",70,1800],
["山口拓也","OF",80,1800],["森田翔","OF",74,1300],["石井誠","OF",69,900],
["小林大輔","DF",82,1900],["中島悠","DF",75,1300],["岡田健","DF",70,900],
["井上直樹","育成",81,1500],["藤田亮介","育成",75,1000],["青木誠","育成",69,700]
];

const KEY = "bleague_gm_ultra_fixed_v4";
let G = null;
let page = "home";

function rand(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rand(a.length)]}
function money(n){return (n/10000).toFixed(2)+"億円"}
function yenMan(n){return Math.round(n).toLocaleString("ja-JP")+"万円"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function newPlayer(type,overall){
  const foreign = type==="外国籍";
  const asia = type==="アジア特別枠";
  const name = foreign ? pick(FOREIGN_FIRST)+" "+pick(FOREIGN_LAST) : pick(FIRST)+pick(LAST);
  const ov = overall || (foreign?76+rand(12):asia?72+rand(12):61+rand(20));
  return {id:uid(),name,type,pos:pick(["PG","SG","SF","PF","C"]),age:foreign?24+rand(9):19+rand(13),ov,
    salary:Math.round((foreign?2200:asia?1500:800+ov*18)/100)*100,
    years:1+rand(3),potential:Math.min(99,ov+rand(15)),games:0,points:0};
}
function newTeam(c,i){
  const players=[];
  players.push(newPlayer("外国籍",80+rand(8)),newPlayer("外国籍",76+rand(9)));
  players.push(newPlayer("アジア特別枠",73+rand(8)));
  while(players.length<10) players.push(newPlayer("日本人"));
  const coaches=[];
  for(const role of ["HC","OF","DF","育成"]){
    const list=COACH_NAMES.filter(x=>x[1]===role);
    const x=list[0];
    coaches.push({id:uid(),name:x[0],role,rating:x[2],salary:x[3],years:2});
  }
  return {name:c[0],division:c[1],players,coaches,cash:300000,price:2500,
    wins:0,losses:0,played:0,pointsFor:0,pointsAgainst:0,sponsor:18000,
    fanBase:5000+rand(5000),history:[],championships:0};
}
function newGame(){
  const teams=CLUBS.map(newTeam);
  const own=teams.find(t=>t.name==="信州ブレイブウォリアーズ");
  own.cash=300000;
  G={season:2026,teams,own:own.name,round:0,totalRounds:60,phase:"regular",
    matches:[],logs:["GMに就任しました。チケット価格とロスターを確認しましょう。"],
    market:[],coachMarket:[],seasonAwards:[],champion:null};
  createMarkets();
  createSchedule();
  save(false);
}
function team(name){return G.teams.find(t=>t.name===name)}
function me(){return team(G.own)}
function playerCountType(t,type){return t.players.filter(p=>p.type===type).length}
function allForeign(t){return t.players.filter(p=>p.type==="外国籍").length}
function specialCount(t){return t.players.filter(p=>p.type==="アジア特別枠"||p.type==="帰化選手").length}
function payroll(t){return t.players.reduce((s,p)=>s+p.salary,0)+t.coaches.reduce((s,c)=>s+c.salary,0)}
function power(t){
  const p=t.players.length?t.players.reduce((s,x)=>s+x.ov,0)/t.players.length:40;
  const coach=t.coaches.reduce((s,c)=>s+c.rating,0)/Math.max(1,t.coaches.length);
  return Math.round(p*.86+coach*.14);
}
function createMarkets(){
  G.market=[];
  for(let i=0;i<55;i++){
    const r=rand(100);
    const type=r<25?"外国籍":r<34?"アジア特別枠":"日本人";
    G.market.push(newPlayer(type,type==="外国籍"?72+rand(17):type==="アジア特別枠"?68+rand(18):60+rand(22)));
  }
  G.coachMarket=COACH_NAMES.map(x=>({id:uid(),name:x[0],role:x[1],rating:x[2],salary:x[3],years:2}));
}
function createSchedule(){
  G.matches=[];
  for(let r=0;r<G.totalRounds;r++){
    const order=[...G.teams].sort(()=>Math.random()-.5);
    for(let i=0;i<order.length;i+=2){
      const home=order[i],away=order[i+1];
      if(!home||!away)continue;
      G.matches.push({round:r+1,home:home.name,away:away.name,done:false,hs:null,as:null});
    }
  }
}
function log(s){G.logs.unshift("S"+G.season+"-"+(G.round+1)+" "+s);G.logs=G.logs.slice(0,50)}
function save(show=true){
  try{localStorage.setItem(KEY,JSON.stringify(G));if(show)alert("セーブしました。")}
  catch(e){if(show)alert("セーブに失敗しました。ブラウザの保存領域を確認してください。")}
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return false;
    const x=JSON.parse(raw);
    if(!x||!Array.isArray(x.teams)||!x.teams.length)return false;
    G=x;
    return true;
  }catch(e){return false}
}
function updateStats(){
  document.getElementById("clubStat").textContent=G.own;
  document.getElementById("cashStat").textContent=money(me().cash);
  document.getElementById("seasonStat").textContent=G.season+"-"+String((G.season+1)%100).padStart(2,"0");
  document.getElementById("powerStat").textContent=power(me());
}
function nav(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });
}
function go(p){page=p;render()}
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-page]");
  if(b)go(b.dataset.page);
});
function render(){
  updateStats();nav();
  const root=document.getElementById("content");
  const pages={home:homePage,roster:rosterPage,market:marketPage,coaches:coachesPage,
    tickets:ticketsPage,league:leaguePage,schedule:schedulePage,finance:financePage};
  root.innerHTML=(pages[page]||homePage)();
  bindPage();
}
function homePage(){
  const t=me();
  const next=G.matches.find(m=>!m.done);
  const nextText=next?`${next.round}節：${next.home} vs ${next.away}`:"レギュラーシーズン終了";
  return `<div class="grid">
    <section class="panel"><h2>クラブ概要</h2>
      <div class="big">${esc(t.name)}</div>
      <p class="muted">${G.season}-${G.season+1} シーズン / ${esc(t.division)}地区</p>
      <div class="row"><span>戦力</span><strong>${power(t)}</strong></div>
      <div class="row"><span>戦績</span><strong>${t.wins}勝 ${t.losses}敗</strong></div>
      <div class="row"><span>登録選手</span><strong>${t.players.length}人</strong></div>
      <div class="row"><span>チケット価格</span><strong>${yenMan(t.price/10000*10000)} / 枚</strong></div>
      <div class="actions"><button data-go="tickets">チケット価格を変更</button><button class="secondary" data-go="roster">ロスター管理</button></div>
    </section>
    <section class="panel"><h2>次の試合</h2><p>${esc(nextText)}</p>
      <p class="muted">試合を進めると勝敗、観客数、チケット収入が反映されます。</p>
      <div class="actions"><button data-action="advance" ${G.phase!=="regular"?"disabled":""}>次の試合日へ進む</button><button class="secondary" data-go="schedule">試合・シーズン</button></div>
      ${G.phase==="offseason"?`<div class="notice"><strong class="gold">オフシーズン中</strong><p>選手・コーチの補強や契約整理を行い、次シーズンを開始できます。</p><button class="success" data-action="nextSeason">次シーズンを開始</button></div>`:""}
    </section>
    <section class="panel"><h2>経営状況</h2>
      <div class="row"><span>スポンサー収入（シーズン想定）</span><strong>${yenMan(t.sponsor)}</strong></div>
      <div class="row"><span>選手・コーチ年俸合計</span><strong>${yenMan(payroll(t))}</strong></div>
      <div class="row"><span>ホーム平均観客数（推定）</span><strong>${Math.round(t.fanBase).toLocaleString()}人</strong></div>
      <div class="actions"><button data-go="finance">経営・セーブ</button></div>
    </section>
    <section class="panel"><h2>直近のニュース</h2>
      ${G.logs.slice(0,6).map(x=>`<div class="logitem">${esc(x)}</div>`).join("")}
    </section>
  </div>`;
}
function rosterPage(){
  const t=me();
  return `<section class="panel"><div class="row"><h2>ロスター管理</h2><span class="pill">${t.players.length}/14人</span></div>
    <p class="muted">登録上限14人。外国籍は最大3人、アジア特別枠・帰化選手は合計1人という簡易ルールです。</p>
    <div class="row"><span>選手年俸合計</span><strong>${yenMan(t.players.reduce((s,p)=>s+p.salary,0))}</strong></div>
    ${t.players.map(p=>`<div class="player"><div class="row"><div><span class="name">${esc(p.name)}</span> <span class="pill">${esc(p.pos)}</span><span class="pill ${p.type==="外国籍"?"foreign":p.type==="アジア特別枠"?"asia":""}">${esc(p.type)}</span></div><strong>OVR ${p.ov}</strong></div>
    <div class="row muted"><span>${p.age}歳 / ${p.years}年契約 / 潜在能力 ${p.potential}</span><span>${yenMan(p.salary)}/年</span></div>
    <div class="actions"><button class="secondary" data-action="extend" data-id="${p.id}">契約1年延長</button><button class="danger" data-action="release" data-id="${p.id}">契約解除</button></div></div>`).join("")}
  </section>`;
}
function marketPage(){
  return `<section class="panel"><h2>選手市場</h2>
    <p class="muted">獲得時に移籍金と初年度年俸を支払います。年俸総額は目安として8億円以内を推奨します。</p>
    <div class="row"><span>現在の年俸総額</span><strong>${yenMan(payroll(me()))}</strong></div>
    ${G.market.slice(0,45).map(p=>`<div class="player"><div class="row"><div><span class="name">${esc(p.name)}</span> <span class="pill">${p.pos}</span><span class="pill ${p.type==="外国籍"?"foreign":p.type==="アジア特別枠"?"asia":""}">${p.type}</span></div><strong>OVR ${p.ov}</strong></div>
    <div class="row muted"><span>${p.age}歳 / 潜在 ${p.potential}</span><span>${yenMan(p.salary)}/年</span></div>
    <div class="actions"><button data-action="sign" data-id="${p.id}">獲得（移籍金込み）</button></div></div>`).join("")}
  </section>`;
}
function coachesPage(){
  const t=me();
  return `<section class="panel"><h2>コーチ陣</h2><p class="muted">HC・オフェンス・ディフェンス・育成の4役を編成できます。各役職1人まで。</p>
    <h3>契約中</h3>
    ${t.coaches.map(c=>`<div class="coach"><div class="row"><div><span class="name">${esc(c.name)}</span><span class="pill">${esc(c.role)}</span></div><strong>能力 ${c.rating}</strong></div>
    <div class="row muted"><span>${c.years}年契約</span><span>${yenMan(c.salary)}/年</span></div>
    <div class="actions"><button class="danger" data-action="fireCoach" data-id="${c.id}">解任</button></div></div>`).join("")}
    <h3>コーチ市場</h3>
    ${G.coachMarket.map(c=>`<div class="coach"><div class="row"><div><span class="name">${esc(c.name)}</span><span class="pill">${esc(c.role)}</span></div><strong>能力 ${c.rating}</strong></div>
    <div class="row muted"><span>${c.years}年契約</span><span>${yenMan(c.salary)}/年</span></div>
    <div class="actions"><button data-action="hireCoach" data-id="${c.id}">契約</button></div></div>`).join("")}
  </section>`;
}
function ticketsPage(){
  const t=me();
  return `<section class="panel"><h2>チケット価格・集客</h2>
    <div class="notice"><div class="muted">現在のチケット価格</div><div class="big">${t.price.toLocaleString()}円</div>
      <p>価格は1試合あたりの平均チケット単価として扱います。変更後の価格が、今後のホームゲーム収入に反映されます。</p>
    </div>
    <form id="ticketForm">
      <div class="field"><label for="ticketPrice">新しいチケット価格（円）</label>
        <input id="ticketPrice" type="number" min="500" max="30000" step="100" value="${t.price}" required>
      </div>
      <div class="actions"><button type="submit">価格を変更</button><button type="button" class="secondary" data-action="ticketReset">初期価格に戻す（2,500円）</button></div>
    </form>
    <h3>価格戦略</h3>
    <div class="grid">
      <div class="notice"><strong>低価格戦略</strong><p class="muted">1,500円：観客数重視。収入は入場者数に左右されます。</p><button class="secondary" data-action="setPrice" data-price="1500">1,500円に設定</button></div>
      <div class="notice"><strong>標準価格戦略</strong><p class="muted">2,500円：初期設定。</p><button class="secondary" data-action="setPrice" data-price="2500">2,500円に設定</button></div>
      <div class="notice"><strong>高価格戦略</strong><p class="muted">4,000円：単価を上げる戦略。</p><button class="secondary" data-action="setPrice" data-price="4000">4,000円に設定</button></div>
      <div class="notice"><strong>プレミアム戦略</strong><p class="muted">6,000円：集客への影響に注意。</p><button class="secondary" data-action="setPrice" data-price="6000">6,000円に設定</button></div>
    </div>
    <p class="muted">価格変更は即時反映されます。過去の試合の収入は変更されません。</p>
  </section>`;
}
function leaguePage(){
  const sorted=[...G.teams].sort((a,b)=>b.wins-a.wins||(b.pointsFor-b.pointsAgainst)-(a.pointsFor-a.pointsAgainst));
  return `<section class="panel"><h2>リーグ順位表</h2><div class="tablewrap"><table><thead><tr><th>順位</th><th>クラブ</th><th>地区</th><th>勝</th><th>敗</th><th>得失点</th><th>戦力</th></tr></thead><tbody>
  ${sorted.map((t,i)=>`<tr ${t.name===G.own?'style="background:#263753"':''}><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.division}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.pointsFor-t.pointsAgainst}</td><td>${power(t)}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}
function schedulePage(){
  const upcoming=G.matches.filter(m=>!m.done).slice(0,20);
  const done=G.matches.filter(m=>m.done).slice(-10).reverse();
  return `<section class="panel"><h2>試合・シーズン進行</h2>
    <div class="notice"><div class="row"><span>進行状況</span><strong>${G.matches.filter(m=>m.done).length}/${G.matches.length} 試合</strong></div>
    <div class="row"><span>現在のフェーズ</span><strong>${G.phase==="regular"?"レギュラーシーズン":G.phase==="offseason"?"オフシーズン":"終了"}</strong></div></div>
    ${G.phase==="regular"?`<button data-action="advance">次の試合日へ進む</button><button class="secondary" data-action="simulate10">10試合日まとめて進める</button>`:""}
    ${G.phase==="offseason"?`<div class="notice"><h3 class="gold">シーズン終了！</h3><p>${esc(G.champion||"")} が今シーズンの優勝クラブです。</p><p>オフシーズンではロスター調整とコーチ補強ができます。準備ができたら次シーズンを開始してください。</p><button class="success" data-action="nextSeason">次シーズンを開始</button></div>`:""}
    <h3>直近の試合結果</h3>${done.length?done.map(m=>`<div class="match">${esc(m.home)} <strong>${m.hs}-${m.as}</strong> ${esc(m.away)}</div>`).join(""):"<p class='muted'>まだ試合結果がありません。</p>"}
    <h3>今後の試合</h3>${upcoming.length?upcoming.map(m=>`<div class="match"><span class="pill">${m.round}節</span> ${esc(m.home)} vs ${esc(m.away)}</div>`).join(""):"<p class='muted'>未消化の試合はありません。</p>"}
  </section>`;
}
function financePage(){
  const t=me();
  return `<div class="grid"><section class="panel"><h2>経営状況</h2>
    <div class="row"><span>運営資金</span><strong>${money(t.cash)}</strong></div>
    <div class="row"><span>スポンサー収入（想定）</span><strong>${yenMan(t.sponsor)}</strong></div>
    <div class="row"><span>選手・コーチ年俸</span><strong>${yenMan(payroll(t))}</strong></div>
    <div class="row"><span>チケット価格</span><strong>${t.price.toLocaleString()}円</strong></div>
    <div class="actions"><button data-go="tickets">チケット戦略</button><button class="secondary" data-action="sponsor">スポンサー営業</button></div>
    </section>
    <section class="panel"><h2>セーブ・データ</h2>
    <div class="actions"><button data-action="save">セーブ</button><button class="secondary" data-action="export">データを書き出す</button></div>
    <div class="field"><label for="importData">書き出したデータを貼り付けて復元</label><textarea id="importData" rows="5" style="width:100%;background:#0d1629;color:white;border:1px solid var(--line);border-radius:8px;padding:10px"></textarea></div>
    <div class="actions"><button data-action="import">データを復元</button><button class="danger" data-action="reset">新しいゲームを開始</button></div>
    <p class="muted">新しいゲームを開始すると、現在のセーブデータは置き換えられます。</p>
    </section></div>`;
}
function bindPage(){
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  const form=document.getElementById("ticketForm");
  if(form)form.addEventListener("submit",e=>{
    e.preventDefault();
    const v=Number(document.getElementById("ticketPrice").value);
    if(!Number.isFinite(v)||v<500||v>30000){alert("価格は500円〜30,000円で設定してください。");return}
    me().price=Math.round(v);
    log("チケット価格を"+me().price.toLocaleString()+"円に変更");
    save(false);render();alert("チケット価格を変更しました。");
  });
  document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action,b.dataset.id,b.dataset.price)));
}
function action(a,id,extra){
  const t=me();
  if(a==="setPrice"){
    t.price=Number(extra);log("チケット価格を"+t.price.toLocaleString()+"円に変更");save(false);render();return;
  }
  if(a==="ticketReset"){
    t.price=2500;log("チケット価格を初期設定に戻しました");save(false);render();return;
  }
  if(a==="advance"){advanceRound();return}
  if(a==="simulate10"){for(let i=0;i<10&&G.phase==="regular";i++)advanceRound(true);save(false);render();return}
  if(a==="nextSeason"){nextSeason();return}
  if(a==="save"){save(true);return}
  if(a==="export"){
    const box=document.getElementById("importData");
    box.value=JSON.stringify(G);
    box.focus();box.select();
    try{document.execCommand("copy");alert("セーブデータを書き出し、コピーを試みました。コピーできない場合は選択範囲を手動でコピーしてください。")}catch(e){alert("テキスト欄のデータをコピーしてください。")}
    return;
  }
  if(a==="import"){
    try{
      const x=JSON.parse(document.getElementById("importData").value);
      if(!x||!Array.isArray(x.teams)||!x.teams.some(z=>z.name===x.own))throw Error("invalid");
      G=x;save(false);render();alert("データを復元しました。");
    }catch(e){alert("データを読み込めません。書き出したデータを確認してください。")}
    return;
  }
  if(a==="reset"){
    if(confirm("現在のゲームを終了して新しいゲームを開始しますか？")&&confirm("現在のセーブデータは失われます。よろしいですか？")){
      localStorage.removeItem(KEY);newGame();page="home";render();
    }return;
  }
  if(a==="sponsor"){
    const cost=500;
    if(t.cash<cost){alert("資金が不足しています。");return}
    t.cash-=cost;t.sponsor+=3000;
    log("スポンサー営業に成功。営業費500万円、スポンサー収入想定+3,000万円");
    save(false);render();alert("スポンサー契約を獲得しました。");return;
  }
  if(a==="sign"){
    const p=G.market.find(x=>x.id===id);if(!p)return;
    if(t.players.length>=14){alert("ロスターは最大14人です。");return}
    if(p.type==="外国籍"&&allForeign(t)>=3){alert("外国籍選手は最大3人です。");return}
    if((p.type==="アジア特別枠"||p.type==="帰化選手")&&specialCount(t)>=1){alert("アジア特別枠と帰化選手は合計1人までです。");return}
    const fee=Math.round(p.salary*.5);
    if(t.cash<p.salary+fee){alert("資金が不足しています。");return}
    if(!confirm(`${p.name}を獲得しますか？\n移籍金：${yenMan(fee)}\n初年度年俸：${yenMan(p.salary)}`))return;
    t.cash-=p.salary+fee;t.players.push({...p,years:2});
    G.market=G.market.filter(x=>x.id!==id);
    log(`${p.name}を獲得。移籍金${yenMan(fee)}、年俸${yenMan(p.salary)}`);
    save(false);render();return;
  }
  if(a==="release"){
    const p=t.players.find(x=>x.id===id);if(!p)return;
    if(!confirm(`${p.name}との契約を解除しますか？`))return;
    t.players=t.players.filter(x=>x.id!==id);
    G.market.push({...p,id:uid()});
    log(`${p.name}との契約を解除`);
    save(false);render();return;
  }
  if(a==="extend"){
    const p=t.players.find(x=>x.id===id);if(!p)return;
    const fee=p.salary;
    if(t.cash<fee){alert("契約延長費用として年俸相当額が必要です。");return}
    if(!confirm(`${p.name}の契約を1年延長しますか？費用：${yenMan(fee)}`))return;
    t.cash-=fee;p.years++;
    log(`${p.name}の契約を1年延長`);
    save(false);render();return;
  }
  if(a==="hireCoach"){
    const c=G.coachMarket.find(x=>x.id===id);if(!c)return;
    if(t.coaches.some(x=>x.role===c.role)){alert("同じ役職のコーチがいます。先に解任してください。");return}
    const fee=c.salary;
    if(t.cash<fee){alert("資金が不足しています。");return}
    if(!confirm(`${c.name}（${c.role}）を契約しますか？\n契約金：${yenMan(fee)}\n年俸：${yenMan(c.salary)}`))return;
    t.cash-=fee;t.coaches.push({...c,years:2});
    G.coachMarket=G.coachMarket.filter(x=>x.id!==id);
    log(`${c.name}を${c.role}コーチとして契約`);
    save(false);render();return;
  }
  if(a==="fireCoach"){
    const c=t.coaches.find(x=>x.id===id);if(!c)return;
    if(!confirm(`${c.name}を解任しますか？`))return;
    t.coaches=t.coaches.filter(x=>x.id!==id);
    G.coachMarket.push({...c,id:uid()});
    log(`${c.name}を解任`);
    save(false);render();return;
  }
}
function advanceRound(silent=false){
  if(G.phase!=="regular"){if(!silent)alert("レギュラーシーズンは終了しています。オフシーズン画面から次シーズンへ進んでください。");return}
  const match=G.matches.find(m=>!m.done);
  if(!match){endSeason();render();return}
  const h=team(match.home),a=team(match.away);
  const homeAdv=match.home===G.own?3:1.5;
  const hp=power(h)+homeAdv+(Math.random()*12-6);
  const ap=power(a)+(Math.random()*12-6);
  const hs=Math.round(78+hp*.38+rand(22));
  const as=Math.round(78+ap*.38+rand(22));
  match.hs=hs;match.as=as;match.done=true;
  if(hs===as){if(Math.random()<.5)match.hs++;else match.as++}
  h.played++;a.played++;
  h.pointsFor+=match.hs;h.pointsAgainst+=match.as;
  a.pointsFor+=match.as;a.pointsAgainst+=match.hs;
  if(match.hs>match.as){h.wins++;a.losses++}else{a.wins++;h.losses++}
  const ownHome=h.name===G.own,ownAway=a.name===G.own;
  if(ownHome||ownAway){
    const crowd=Math.max(800,Math.round(ticketDemand(t)));
    const revenue=crowd*t.price;
    const concession=Math.round(crowd*450);
    const sponsorGame=Math.round(t.sponsor/30);
    const cost=220000+Math.round(crowd*250);
    const net=revenue/10000+concession/10000+sponsorGame-cost;
    t.cash+=net;
    t.fanBase=Math.max(1500,Math.round(t.fanBase+(match.hs>match.as?150:-70)+(t.price<2500?100:t.price>4500?-180:0)));
    if(ownHome)log(`ホーム戦 ${match.hs}-${match.as}。観客${crowd.toLocaleString()}人、チケット収入${yenMan(revenue/10000)}相当`);
    else log(`アウェー戦 ${match.hs}-${match.as}`);
  }
  G.round++;
  if(!silent)log(`${match.round}節終了：${match.home} ${match.hs}-${match.as} ${match.away}`);
  if(!G.matches.some(m=>!m.done))endSeason();
  save(false);
  if(!silent)render();
}
function ticketDemand(t){
  const priceFactor=Math.max(.35,1.35-t.price/10000);
  const performance=1+Math.max(-.2,Math.min(.2,(t.wins-t.losses)*.003));
  return t.fanBase*priceFactor*performance;
}
function endSeason(){
  if(G.phase!=="regular")return;
  const sorted=[...G.teams].sort((a,b)=>b.wins-a.wins||(b.pointsFor-b.pointsAgainst)-(a.pointsFor-a.pointsAgainst));
  G.champion=sorted[0].name;
  sorted[0].championships++;
  G.phase="offseason";
  log(`シーズン終了。${G.champion}がレギュラーシーズン首位。オフシーズンに移行しました。`);
  alert(`シーズン終了！\n首位：${G.champion}\nあなたのクラブ：${me().wins}勝 ${me().losses}敗\nオフシーズンに移行しました。補強後「次シーズンを開始」を押してください。`);
  save(false);
}
function nextSeason(){
  if(G.phase!=="offseason"){alert("シーズン終了後に実行できます。");return}
  const t=me();
  if(!confirm(`${G.season}-${G.season+1}シーズンを終了し、次シーズンを開始しますか？`))return;
  G.teams.forEach(cl=>{
    cl.players.forEach(p=>{
      p.age++;
      p.years--;
      if(p.age<=25)p.ov=Math.min(p.potential,p.ov+(Math.random()<.75?1:0));
      else if(p.age>=32&&Math.random()<.7)p.ov=Math.max(45,p.ov-1);
      if(p.years<=0){
        G.market.push({...p,id:uid(),years:1});
        log(`${cl.name}：${p.name}の契約満了`);
      }
    });
    cl.players=cl.players.filter(p=>p.years>0);
    cl.coaches.forEach(c=>c.years--);
    cl.coaches.filter(c=>c.years<=0).forEach(c=>G.coachMarket.push({...c,id:uid()}));
    cl.coaches=cl.coaches.filter(c=>c.years>0);
    cl.wins=0;cl.losses=0;cl.played=0;cl.pointsFor=0;cl.pointsAgainst=0;
    cl.cash-=Math.round(payroll(cl)*.3);
    cl.cash+=cl.sponsor;
    cl.cash=Math.max(0,cl.cash);
  });
  G.season++;
  G.round=0;G.phase="regular";G.champion=null;
  createMarkets();createSchedule();
  log(`${G.season}-${G.season+1}シーズン開幕。新しい日程を作成しました。`);
  save(false);page="home";render();
}
if(!load())newGame();
render();
</script>
