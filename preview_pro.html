
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B.LEAGUE GM 超本格版</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--text:#f3f6ff;--muted:#9ba9c6;--gold:#ffc857;--blue:#63a7ff;--green:#55d6a0;--red:#ff7787}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-size:14px}
header{padding:20px 16px 14px;background:linear-gradient(130deg,#17264c,#263c70);border-bottom:1px solid #34476c}
header .eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;font-weight:800}
h1{font-size:23px;margin:6px 0}
header p{color:#c7d3ed;font-size:12px;margin:5px 0}
.wrap{max-width:980px;margin:auto;padding:12px 12px 90px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat,.panel,.card{background:var(--panel);border:1px solid #293652;border-radius:13px;padding:13px}
.stat small,.muted{color:var(--muted)}
.stat strong{display:block;font-size:20px;margin-top:5px}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;background:var(--panel);color:var(--muted);border:1px solid #293652;border-radius:9px;padding:10px 12px;font-size:12px}
nav button.active{background:var(--gold);color:#172039;border-color:var(--gold);font-weight:800}
h2{font-size:18px;margin:8px 0 12px}
h3{font-size:14px;margin:0 0 9px}
p{line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button,select,input{font:inherit}
.action{border:0;border-radius:9px;background:var(--gold);color:#1b2236;font-weight:800;padding:10px 12px;cursor:pointer}
.action.secondary{background:#2b3a59;color:var(--text);border:1px solid #3a4b6c}
.action.danger{background:#602d3c;color:#ffd9df}
.action:disabled{opacity:.35}
button:active{transform:scale(.98)}
.full{width:100%;margin-top:8px}
input,select{background:#0e172b;color:var(--text);border:1px solid #364866;border-radius:8px;padding:10px;max-width:100%}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
.bar{height:7px;border-radius:9px;background:#293651;overflow:hidden;margin:7px 0}
.bar span{display:block;height:100%;background:var(--green)}
.pill{font-size:10px;padding:4px 7px;border-radius:20px;background:#293a58;color:#c9d8f3}
.item{padding:11px 0;border-bottom:1px solid #2a3650}
.item:last-child{border-bottom:0}
.bigscore{font-size:25px;font-weight:900;text-align:center;margin:12px 0}
.log{font-size:12px;color:#c4d0e8;line-height:1.8;white-space:pre-line}
.empty{color:var(--muted);padding:20px;text-align:center}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #2b3750;white-space:nowrap}
th{color:var(--muted)}
.tablewrap{overflow-x:auto}
footer{position:fixed;bottom:0;left:0;right:0;background:#10182aee;border-top:1px solid #293652;padding:9px 12px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:var(--muted);z-index:4}
.notice{border-left:3px solid var(--gold);padding:9px 11px;background:#282b35;border-radius:4px;font-size:12px;line-height:1.6;margin:10px 0}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:18px}}
</style>
</head>
<body>
<header>
 <div class="eyebrow">BASKETBALL MANAGEMENT SIMULATOR</div>
 <h1>🏀 B.LEAGUE GM <span class="gold">PRO</span></h1>
 <p>クラブ経営・補強・育成・優勝を目指すGMシミュレーション</p>
</header>
<div class="wrap">
 <div id="stats" class="stats"></div>
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<footer>GM PRO ・ ゲーム内シミュレーション ・ こまめにセーブしよう</footer>
<script>
"use strict";

const CLUBS=[
["レバンガ北海道","東"],["仙台89ERS","東"],["秋田ノーザンハピネッツ","東"],
["茨城ロボッツ","東"],["宇都宮ブレックス","東"],["群馬クレインサンダーズ","東"],
["アルティーリ千葉","東"],["千葉ジェッツ","東"],["アルバルク東京","東"],
["サンロッカーズ渋谷","東"],["川崎ブレイブサンダース","東"],["横浜ビー・コルセアーズ","東"],
["富山グラウジーズ","東"],["信州ブレイブウォリアーズ","西"],["三遠ネオフェニックス","西"],
["シーホース三河","西"],["名古屋ダイヤモンドドルフィンズ","西"],["滋賀レイクス","西"],
["京都ハンナリーズ","西"],["大阪エヴェッサ","西"],["神戸ストークス","西"],
["島根スサノオマジック","西"],["広島ドラゴンフライズ","西"],["佐賀バルーナーズ","西"],
["長崎ヴェルカ","西"],["琉球ゴールデンキングス","西"]
];

const POS=["PG","SG","SF","PF","C"];
const FIRST=["蒼真","蓮","悠真","大翔","陽向","颯太","湊","陸","翔","拓海","健太","直哉","海斗","亮太","優斗","駿","颯","晴","大和","一樹","隼人","圭吾","智也","悠","和真","凌","翔太","龍之介","慧","琉生"];
const LAST=["高橋","佐藤","鈴木","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","山田","松本","井上","木村","林","清水","森","池田","橋本","石井","斎藤","阿部","前田","藤田","岡田","後藤","長谷川","村上","近藤"];

const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const money=n=>(n).toFixed(2)+"億円";
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function makePlayer(overall,clubId,rookie=false){
 const age=rookie?rand(18,22):rand(21,34);
 const potential=clamp(overall+rand(-3,12),55,99);
 const pos=POS[rand(0,4)];
 return {id:uid(),name:LAST[rand(0,LAST.length-1)]+FIRST[rand(0,FIRST.length-1)],
 pos,age,ovr:overall,pot:potential,stamina:100,morale:rand(65,95),
 salary:Math.round((overall-55)*0.025*100)/100,
 clubId,rookie};
}
function createClub(c,i){
 const strength=clamp(70+rand(-9,10)+(i===4?5:0),60,90);
 const roster=Array.from({length:10},(_,j)=>makePlayer(
 clamp(strength+rand(-9,8),57,94),i,j<2));
 return {id:i,name:c[0],region:c[1],roster,cash:0,rep:rand(40,75),
 wins:0,losses:0,pf:0,pa:0,fan:rand(55,85),training:0};
}
function freshGame(clubId){
 const clubs=CLUBS.map(createClub);
 clubs.forEach(c=>c.cash= c.id===clubId?30:rand(8,24));
 const user=clubs[clubId];
 user.cash=30;
 return {version:1,clubId,season:2026,week:1,clubs,
 cash:30,debt:0,sponsor:0,ticket:2500,training:0,
 log:["GM就任！チームを強化してシーズン優勝を目指そう。"],
 market:[],history:[],played:[],tab:"ホーム"};
}
let game=null;
let tab="ホーム";

function loadGame(){
 try{
  const raw=localStorage.getItem("bleagueGMProSave");
  if(raw){const s=JSON.parse(raw);if(s&&s.clubs&&s.clubs.length===26){game=s;return;}}
 }catch(e){}
 game=null;
}
function saveGame(silent=false){
 try{
  localStorage.setItem("bleagueGMProSave",JSON.stringify(game));
  if(!silent) alert("セーブしました！");
 }catch(e){alert("保存できませんでした。ブラウザの保存設定を確認してください。");}
}
function club(){return game.clubs[game.clubId];}
function allPlayers(){return game.clubs.flatMap(c=>c.roster);}
function findPlayer(id){return allPlayers().find(p=>p.id===id);}
function addLog(t){game.log.unshift("第"+game.week+"週："+t);game.log=game.log.slice(0,40);}
function avg(c){return Math.round(c.roster.reduce((s,p)=>s+p.ovr,0)/Math.max(1,c.roster.length));}
function payroll(c){return c.roster.reduce((s,p)=>s+p.salary,0);}
function strength(c){return avg(c)+Math.min(5,c.roster.length/2)+rand(-5,5);}
function sortStandings(){return [...game.clubs].sort((a,b)=>b.wins-a.wins||((b.pf-b.pa)-(a.pf-a.pa)));}
function cashCheck(amount){if(game.cash<amount){alert("資金が足りません。");return false;}return true;}
function update(){
 document.getElementById("stats").innerHTML=`
 <div class="stat"><small>運営クラブ</small><strong>${club().name}</strong></div>
 <div class="stat"><small>手元資金</small><strong class="${game.cash<3?'red':'gold'}">${money(game.cash)}</strong></div>
 <div class="stat"><small>シーズン</small><strong>${game.season}年</strong><small>第${game.week}週</small></div>
 <div class="stat"><small>戦績</small><strong>${club().wins}勝 ${club().losses}敗</strong></div>`;
 const tabs=["ホーム","選手","移籍市場","育成","試合","経営","順位表","セーブ"];
 document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join("");
 const pages={ホーム:home,選手:players,移籍市場:market,育成:training,試合:matches,経営:business,順位表:standings,セーブ:savePage};
 document.getElementById("main").innerHTML=pages[tab]();
}
function go(t){tab=t;update();window.scrollTo(0,0);}
function home(){
 const c=club(),standing=sortStandings().findIndex(x=>x.id===c.id)+1;
 return `<h2>クラブダッシュボード</h2>
 <div class="grid">
 <section class="panel"><h3>🏆 チーム状況</h3>
 <div class="row"><span class="muted">平均総合力</span><b>${avg(c)}</b></div><div class="bar"><span style="width:${avg(c)}%"></span></div>
 <div class="row"><span class="muted">所属選手</span><b>${c.roster.length}人</b></div>
 <div class="row"><span class="muted">リーグ順位</span><b>${standing}位 / 26</b></div>
 <div class="row"><span class="muted">ファン満足度</span><b>${c.fan}%</b></div></section>
 <section class="panel"><h3>💰 経営状況</h3>
 <div class="row"><span class="muted">選手年俸合計</span><b>${money(payroll(c))}</b></div>
 <div class="row"><span class="muted">スポンサー収入</span><b>${money(game.sponsor)}</b></div>
 <div class="row"><span class="muted">借入金</span><b>${money(game.debt)}</b></div>
 <p class="muted">補強だけでなく、経営と育成も計画的に進めよう。</p></section>
 </div>
 <section class="panel" style="margin-top:10px"><h3>⚡ クイックアクション</h3>
 <div class="grid">
 <button class="action" onclick="go('試合')">試合を進める</button>
 <button class="action secondary" onclick="go('移籍市場')">選手を補強する</button>
 <button class="action secondary" onclick="go('育成')">チームを育成する</button>
 <button class="action secondary" onclick="go('経営')">収益を増やす</button>
 </div></section>
 <section class="panel" style="margin-top:10px"><h3>📋 GMニュース</h3><div class="log">${game.log.map(esc).join("\n")}</div></section>
 <div class="notice">選手名・能力値・契約額はゲーム用のシミュレーションデータです。実在選手の現所属・契約を反映した公式データではありません。</div>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}
function players(){
 const c=club();
 return `<h2>ロスター管理</h2><p class="muted">選手の能力、年齢、ポジション、年俸を確認しよう。</p>
 <div class="panel"><div class="row"><span>登録選手：${c.roster.length}人</span><span>年俸合計：${money(payroll(c))}</span></div></div>
 <div class="grid" style="margin-top:10px">${c.roster.slice().sort((a,b)=>b.ovr-a.ovr).map(p=>`
 <div class="card"><div class="row"><b>${esc(p.name)}</b><span class="pill">${p.pos}</span></div>
 <div class="row" style="margin-top:9px"><span class="muted">総合力</span><strong class="gold">${p.ovr}</strong></div>
 <div class="bar"><span style="width:${p.ovr}%"></span></div>
 <div class="row"><span class="muted">年齢 ${p.age}歳</span><span class="muted">潜在能力 ${p.pot}</span></div>
 <div class="row" style="margin-top:8px"><span class="muted">年俸 ${money(p.salary)}</span></div>
 <button class="action secondary full" onclick="releasePlayer('${p.id}')">契約解除</button></div>`).join("")}</div>`;
}
function releasePlayer(id){
 const c=club(),p=c.roster.find(x=>x.id===id);
 if(!p)return;
 if(c.roster.length<=5){alert("最低5人の選手を残してください。");return;}
 if(!confirm(p.name+"との契約を解除しますか？"))return;
 c.roster=c.roster.filter(x=>x.id!==id);
 game.cash+=p.salary*0.15;
 addLog(p.name+"との契約を解除。");
 update();
}
function ensureMarket(){
 if(!game.market.length){
  game.market=Array.from({length:18},()=>makePlayer(rand(65,88),null,Math.random()<0.3));
 }
}
function market(){
 ensureMarket();
 return `<h2>移籍市場</h2>
 <p class="muted">獲得費用は能力・年齢によって変動。契約前に資金を確認しよう。</p>
 <div class="grid">${game.market.map(p=>{
 const fee=+(p.salary*0.55+Math.max(0,p.ovr-70)*0.025).toFixed(2);
 return `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="pill">${p.pos}</span></div>
 <div class="row" style="margin-top:9px"><span>総合力</span><b class="gold">${p.ovr}</b></div>
 <div class="row"><span class="muted">${p.age}歳・潜在 ${p.pot}</span></div>
 <div class="item"><span class="muted">年俸：</span>${money(p.salary)}<br><span class="muted">契約金：</span>${money(fee)}</div>
 <button class="action full" onclick="signPlayer('${p.id}',${fee})">契約する</button></div>`;
 }).join("")}</div>`;
}
function signPlayer(id,fee){
 const c=club(),p=game.market.find(x=>x.id===id);
 if(!p)return;
 if(c.roster.length>=18){alert("登録上限18人に達しています。");return;}
 if(!cashCheck(fee))return;
 if(!confirm(p.name+"と契約しますか？\n契約金："+money(fee)+"\n年俸："+money(p.salary)))return;
 game.cash-=fee;
 p.clubId=c.id;p.morale=75;
 c.roster.push(p);
 game.market=game.market.filter(x=>x.id!==id);
 addLog(p.name+"を獲得！");
 update();
}
function training(){
 const c=club();
 return `<h2>チーム育成</h2><p class="muted">育成には費用がかかる。資金とチーム状況に合わせて選択しよう。</p>
 <div class="grid">
 <div class="card"><h3>🏀 基礎練習</h3><p class="muted">全選手の能力を少しずつ底上げする。</p><b>費用：0.20億円</b><button class="action full" onclick="train('basic')">基礎練習を実施</button></div>
 <div class="card"><h3>🛡️ 守備強化</h3><p class="muted">守備力を意識したトレーニング。</p><b>費用：0.35億円</b><button class="action full" onclick="train('defense')">守備を強化</button></div>
 <div class="card"><h3>🌱 若手育成</h3><p class="muted">若手の成長と潜在能力を重視する。</p><b>費用：0.30億円</b><button class="action full" onclick="train('young')">若手を育成</button></div>
 <div class="card"><h3>❤️ コンディション管理</h3><p class="muted">選手のスタミナと士気を回復する。</p><b>費用：0.15億円</b><button class="action full" onclick="train('rest')">回復メニュー</button></div>
 </div><section class="panel" style="margin-top:10px"><h3>現在のチーム</h3><div class="row"><span>平均総合力</span><b>${avg(c)}</b></div><div class="row"><span>育成実施回数</span><b>${game.training}回</b></div></section>`;
}
function train(type){
 const costs={basic:.20,defense:.35,young:.30,rest:.15};
 const cost=costs[type];
 if(!cashCheck(cost))return;
 game.cash-=cost;game.training++;
 const c=club();
 if(type==="rest"){
  c.roster.forEach(p=>{p.stamina=100;p.morale=clamp(p.morale+8,0,100)});
  addLog("コンディション管理を実施。士気が回復した。");
 }else{
  const target=type==="young"?c.roster.filter(p=>p.age<=23):c.roster;
  if(!target.length){alert("対象となる若手選手がいません。");game.cash+=cost;return;}
  const p=target[rand(0,target.length-1)];
  if(p.ovr<p.pot && Math.random()<0.75)p.ovr++;
  else if(type==="defense" && Math.random()<0.25)p.ovr++;
  p.stamina=clamp(p.stamina-3,0,100);
  addLog((type==="young"?"若手育成":type==="defense"?"守備強化":"基礎練習")+"を実施。"+p.name+"が成長した。");
 }
 update();
}
function matches(){
 const c=club();
 const next=game.clubs.filter(x=>x.id!==c.id).sort((a,b)=>a.wins-b.wins)[0];
 return `<h2>試合・シーズン</h2>
 <section class="panel"><div class="row"><div><small class="muted">シーズン</small><h3>${game.season}年 第${game.week}週</h3></div><span class="pill">${game.played.length}試合記録</span></div>
 <p>試合を進めると、リーグ内の全クラブが試合を行い、勝敗・資金・順位が変化する。</p>
 <div class="notice">試合結果はゲーム内の能力値を使った架空シミュレーションで、実際の試合結果や公式日程ではありません。</div>
 <button class="action full" onclick="playWeek()">▶ 1週間進める（リーグ戦）</button>
 <button class="action secondary full" onclick="playWeek(true)">▶ 4週間まとめて進める</button>
 </section>
 <section class="panel" style="margin-top:10px"><h3>チーム戦績</h3><div class="bigscore">${c.wins}勝 ${c.losses}敗</div><div class="row"><span>得点</span><b>${c.pf}</b></div><div class="row"><span>失点</span><b>${c.pa}</b></div><div class="row"><span>得失点差</span><b>${c.pf-c.pa}</b></div></section>
 <section class="panel" style="margin-top:10px"><h3>直近の試合ログ</h3><div class="log">${game.played.slice(-12).reverse().map(esc).join("\n")||"まだ試合を行っていません。"}</div></section>`;
}
function playWeek(multi=false){
 const weeks=multi?4:1;
 if(game.week>60){alert("レギュラーシーズンが終了しました。シーズン終了処理をしてください。");return;}
 for(let w=0;w<weeks && game.week<=60;w++){
  for(let i=0;i<game.clubs.length;i++){
   const a=game.clubs[i],b=game.clubs[(i+1+((game.week*3)%25))%26];
   if(a.id===b.id)continue;
   const sa=Math.max(40,Math.round(strength(a)+rand(-10,10)));
   const sb=Math.max(40,Math.round(strength(b)+rand(-10,10)));
   const pa=sa+rand(55,75),pb=sb+rand(55,75);
   const winner=pa>=pb?a:b,loser=winner===a?b:a;
   winner.wins++;loser.losses++;
   winner.pf+=Math.max(pa,pb);winner.pa+=Math.min(pa,pb);
   loser.pf+=Math.min(pa,pb);loser.pa+=Math.max(pa,pb);
   [a,b].forEach(t=>t.roster.forEach(p=>p.stamina=clamp(p.stamina-rand(5,12),15,100)));
   if(a.id===game.clubId||b.id===game.clubId){
    const userWon=winner.id===game.clubId;
    const diff=Math.abs(pa-pb);
    game.cash+=userWon?.08:.025;
    cFanChange(userWon?2:-1);
    game.played.push(`${a.name} ${pa} - ${pb} ${b.name}（${userWon?"勝利":"敗北"}）`);
    if(a.id===game.clubId||b.id===game.clubId)addLog((userWon?"勝利！":"敗北。")+"試合収入を計上。");
   }
  }
  game.week++;
  game.cash+=game.sponsor/12;
  game.cash-=payroll(club())/12;
  game.cash-=0.035;
  if(game.cash<0)game.debt+=Math.abs(game.cash),game.cash=0;
 }
 game.played=game.played.slice(-50);
 update();
}
function cFanChange(n){club().fan=clamp(club().fan+n,0,100);}
function business(){
 const c=club();
 return `<h2>クラブ経営</h2>
 <div class="grid">
 <div class="card"><h3>🎟️ チケット価格</h3><p class="muted">値上げは収入増につながるが、ファン満足度が下がる場合もある。</p>
 <label>1枚あたりの価格（円）</label><select id="ticket"><option value="1500">1,500円</option><option value="2000">2,000円</option><option value="2500" selected>2,500円</option><option value="3000">3,000円</option><option value="4000">4,000円</option><option value="5000">5,000円</option></select>
 <button class="action full" onclick="setTicket()">価格を設定</button></div>
 <div class="card"><h3>🤝 スポンサー営業</h3><p class="muted">営業活動を行い、スポンサー契約を獲得する。</p><b>営業費用：0.05億円</b><button class="action full" onclick="getSponsor()">スポンサー営業</button></div>
 <div class="card"><h3>📣 ファンイベント</h3><p class="muted">ファン満足度を高め、集客力を伸ばす。</p><b>費用：0.10億円</b><button class="action full" onclick="eventFan()">イベント開催</button></div>
 <div class="card"><h3>🏦 借入金返済</h3><p class="muted">手元資金を使って借入金を減らす。</p><div class="row"><span>借入残高</span><b>${money(game.debt)}</b></div><button class="action full" onclick="repay()">1億円を返済</button></div>
 </div>
 <section class="panel" style="margin-top:10px"><h3>経営指標</h3>
 <div class="row"><span>チケット価格</span><b>${game.ticket.toLocaleString()}円</b></div>
 <div class="row"><span>スポンサー年換算収入</span><b>${money(game.sponsor)}</b></div>
 <div class="row"><span>ファン満足度</span><b>${c.fan}%</b></div>
 <div class="row"><span>選手年俸合計</span><b>${money(payroll(c))}</b></div></section>`;
}
function setTicket(){
 const v=Number(document.getElementById("ticket").value);
 game.ticket=v;
 if(v>=4000)cFanChange(-3);else if(v<=2000)cFanChange(2);
 addLog("チケット価格を"+v.toLocaleString()+"円に設定。");
 update();
}
function getSponsor(){
 if(!cashCheck(.05))return;
 game.cash-=.05;
 const gain=+(0.2+Math.random()*.55).toFixed(2);
 game.sponsor+=gain;
 club().rep=clamp(club().rep+2,0,100);
 addLog("スポンサー契約を獲得。年間収入+"+money(gain));
 update();
}
function eventFan(){
 if(!cashCheck(.10))return;
 game.cash-=.10;cFanChange(8);
 addLog("ファンイベントを開催。満足度が上昇。");
 update();
}
function repay(){
 const n=Math.min(1,game.debt);
 if(n<=0){alert("返済する借入金はありません。");return;}
 if(!cashCheck(n))return;
 game.cash-=n;game.debt-=n;
 addLog(money(n)+"を借入金返済に充当。");
 update();
}
function standings(){
 const rows=sortStandings();
 return `<h2>リーグ順位表</h2><p class="muted">勝利数、次いで得失点差で順位を表示。</p>
 <div class="panel tablewrap"><table><thead><tr><th>順位</th><th>クラブ</th><th>地区</th><th>勝</th><th>敗</th><th>得失点</th><th>平均力</th></tr></thead><tbody>
 ${rows.map((c,i)=>`<tr style="${c.id===game.clubId?'background:#26344e':''}"><td>${i+1}</td><td>${esc(c.name)}${c.id===game.clubId?' ★':''}</td><td>${c.region}</td><td>${c.wins}</td><td>${c.losses}</td><td>${c.pf-c.pa}</td><td>${avg(c)}</td></tr>`).join("")}
 </tbody></table></div>`;
}
function savePage(){
 return `<h2>セーブ・ゲーム設定</h2>
 <section class="panel"><h3>💾 データ保存</h3><p>この端末のブラウザにゲームデータを保存する。別の端末やブラウザには自動同期されない。</p>
 <button class="action full" onclick="saveGame()">セーブする</button>
 <button class="action secondary full" onclick="exportSave()">セーブデータをテキスト出力</button>
 <label>セーブデータを読み込む</label><textarea id="importText" rows="4" style="width:100%;background:#0e172b;color:white;border:1px solid #364866;border-radius:8px;padding:9px" placeholder="エクスポートしたデータを貼り付け"></textarea>
 <button class="action secondary full" onclick="importSave()">セーブデータを読み込む</button></section>
 <section class="panel" style="margin-top:10px"><h3>🔄 新しいゲーム</h3><p class="muted">新規ゲームを開始すると現在のゲームは上書きされる。必要なら先にエクスポートしよう。</p>
 <button class="action danger full" onclick="newGame()">新規ゲームを開始</button></section>
 <div class="notice">保存データはこのブラウザのローカル領域を利用します。ブラウザのデータ消去などで失われる場合があるため、必要に応じてエクスポートしてください。</div>`;
}
function exportSave(){
 const data=JSON.stringify(game);
 const blob=new Blob([data],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="bleague-gm-save.json";a.click();
 URL.revokeObjectURL(url);
}
function importSave(){
 try{
  const d=JSON.parse(document.getElementById("importText").value);
  if(!d.clubs||d.clubs.length!==26||!Number.isInteger(d.clubId))throw Error();
  game=d;saveGame(true);update();alert("読み込みました！");
 }catch(e){alert("データを読み込めません。正しいセーブデータか確認してください。");}
}
function newGame(){
 if(!confirm("現在のゲームを上書きして新規ゲームを開始しますか？"))return;
 const options=CLUBS.map((c,i)=>`${i+1}. ${c[0]}`).join("\n");
 const answer=prompt("運営するクラブの番号を入力してください。\n"+options,"14");
 const n=Number(answer)-1;
 if(answer===null||!Number.isInteger(n)||n<0||n>=CLUBS.length){alert("番号が正しくありません。");return;}
 game=freshGame(n);tab="ホーム";saveGame(true);update();
}
loadGame();
if(!game){
 const pick=prompt("B.LEAGUE GM PROへようこそ！\n運営するクラブの番号を入力してください。\n\n"+CLUBS.map((c,i)=>`${i+1}. ${c[0]}`).join("\n"),"14");
 const n=pick===null?13:Number(pick)-1;
 game=freshGame(Number.isInteger(n)&&n>=0&&n<CLUBS.length?n:13);
 saveGame(true);
}
update();
setInterval(()=>saveGame(true),60000);
</script>
</body>
</html>
